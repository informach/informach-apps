<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sons do Morada</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Mesmo estilo das outras páginas da biblioteca: palco azul-noite e ficha à direita */
:root {
  --noite: #1e2247;      /* fundo */
  --painel: #262b57;     /* ficha */
  --cartao: #2c3263;     /* cartões de som */
  --risco: #3a4078;      /* bordas */
  --tinta: #eef0ff;      /* texto */
  --apagada: #a9aed8;    /* texto secundário */
  --mel: #f2b84b;        /* destaque */
  --rosa: #f4a3bf;       /* segundo destaque */
  --menta: #7fd8be;      /* tocando */
  --display: "Fredoka", "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --texto: "Figtree", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--noite); color: var(--tinta); font-family: var(--texto); font-size: 15px; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: 100%; }
.palco { min-width: 0; min-height: 0; overflow-y: auto; padding: 22px max(20px, env(safe-area-inset-left, 0px)) 40px 24px; }
.ficha { background: var(--painel); border-left: 1px solid var(--risco); overflow-y: auto; display: flex; flex-direction: column; gap: 18px;
  padding-block: 22px 28px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); }
h1 { font-family: var(--display); font-weight: 600; font-size: 28px; line-height: 1.05; margin: 0; letter-spacing: 0.2px; }
h2 { font-family: var(--display); font-weight: 600; font-size: 21px; margin: 0 0 4px; }
h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--apagada); margin: 22px 0 10px; font-weight: 600; }
.sub { margin: 6px 0 0; color: var(--apagada); line-height: 1.45; font-size: 14px; }
.rotulo { font-size: 11.5px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--apagada); margin: 0 0 8px; font-weight: 600; }
.abas { display: flex; flex-wrap: wrap; gap: 6px; margin: 18px 0 6px; }
.abas button, .chips button, .seg button { font: 600 13.5px var(--texto); color: var(--tinta); background: var(--noite); border: 1px solid var(--risco);
  border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.abas button[aria-pressed="true"] { background: var(--mel); border-color: var(--mel); color: #2a1d05; }
.abas .n { font-weight: 500; opacity: 0.75; margin-left: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { font-weight: 500; padding: 7px 12px; }
.chips button[aria-pressed="true"] { background: var(--rosa); border-color: var(--rosa); color: #3a0e1d; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--noite); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; border-radius: 9px; padding: 9px 6px; background: transparent; color: var(--apagada); }
.seg button[aria-pressed="true"] { background: var(--mel); color: #2a1d05; }
.desc-cat { color: var(--apagada); margin: 4px 0 0; line-height: 1.45; font-size: 14px; max-width: 70ch; }
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.som { display: flex; align-items: center; gap: 10px; background: var(--cartao); border: 2px solid transparent; border-radius: 12px;
  padding: 9px 10px; cursor: pointer; color: var(--tinta); font: 500 13.5px var(--texto); text-align: left; min-width: 0; }
.som:hover { border-color: var(--risco); }
.som[aria-pressed="true"] { border-color: var(--menta); }
.som .play { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--noite); display: grid; place-items: center; }
.som[aria-pressed="true"] .play { background: var(--menta); }
.som .play svg { width: 13px; height: 13px; fill: var(--tinta); }
.som[aria-pressed="true"] .play svg { fill: #0f2a22; }
.som .txt { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.som .nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.som .meta { font-size: 11.5px; color: var(--apagada); display: flex; gap: 6px; flex-wrap: wrap; }
.selo { font-size: 10.5px; font-weight: 600; letter-spacing: 0.4px; padding: 1px 6px; border-radius: 6px; background: var(--noite); color: var(--apagada); }
.selo.cc0 { background: #4a3c1a; color: var(--mel); }
.selo.laco { background: #23443c; color: var(--menta); }
button:focus-visible { outline: 2px solid var(--mel); outline-offset: 2px; }
.onda { width: 100%; height: 86px; background: var(--noite); border-radius: 12px; display: block; }
.controles { display: grid; grid-template-columns: auto auto 1fr; gap: 10px; align-items: center; }
.btn { font: 600 14px var(--texto); border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; background: var(--mel); color: #2a1d05; }
.btn.sec { background: var(--noite); color: var(--tinta); border: 1px solid var(--risco); }
.btn[disabled] { opacity: 0.45; cursor: default; }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--tinta); cursor: pointer; justify-self: end; }
.toggle input { width: 18px; height: 18px; accent-color: var(--menta); }
.vol { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: 13.5px; color: var(--apagada); }
input[type=range] { width: 100%; accent-color: var(--mel); }
.dados { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 14px; }
.dados dt { color: var(--apagada); }
.dados dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.nota { font-size: 12.5px; color: var(--apagada); line-height: 1.5; margin: 0; border-top: 1px solid var(--risco); padding-top: 14px; }
.nota a, .cred a { color: var(--mel); }
.cred { font-size: 13px; line-height: 1.5; background: var(--noite); border-radius: 12px; padding: 10px 12px; }
.vazio { color: var(--apagada); font-size: 14px; }
/* voz */
.voz { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 18px; align-items: start; background: var(--cartao); border-radius: 16px; padding: 16px; }
.voz .campos { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.rosto { width: 200px; height: 214px; }
.legenda { font-family: var(--display); font-size: 20px; min-height: 1.4em; color: var(--tinta); overflow-wrap: anywhere; }
.frases { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.frase { background: var(--cartao); border: 2px solid transparent; border-radius: 10px; padding: 8px 10px; text-align: left; cursor: pointer;
  color: var(--tinta); font: 500 13px var(--texto); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frase[aria-pressed="true"] { border-color: var(--menta); }
/* música */
.musicas { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.musica { background: var(--cartao); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; border: 2px solid transparent; }
.musica[data-tocando="true"] { border-color: var(--menta); }
.musica .titulo { font-family: var(--display); font-size: 18px; }
.musica .info { font-size: 12.5px; color: var(--apagada); line-height: 1.4; }
.musica .acoes { display: flex; flex-wrap: wrap; gap: 6px; }
.musica .acoes button { font: 600 13px var(--texto); border-radius: 999px; padding: 7px 12px; cursor: pointer; border: 1px solid var(--risco); background: var(--noite); color: var(--tinta); }
.musica .acoes button.principal { background: var(--mel); border-color: var(--mel); color: #2a1d05; }
.musica .estado { font-size: 12.5px; color: var(--menta); min-height: 1.2em; font-variant-numeric: tabular-nums; }
.lista-cred { display: flex; flex-direction: column; gap: 8px; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; height: auto; min-height: 100%; }
  .palco { overflow: visible; padding: 18px max(16px, env(safe-area-inset-left, 0px)) 24px max(16px, env(safe-area-inset-right, 0px)); }
  .ficha { border-left: 0; border-top: 1px solid var(--risco); overflow: visible; padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .voz { grid-template-columns: minmax(0, 1fr); }
  .rosto { justify-self: center; }
  .grade { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}
</style>
</head>
<body>
<div class="app">
  <main class="palco">
    <h1>Sons do Morada</h1>
    <p class="sub" id="sub">Carregando a biblioteca…</p>
    <div class="abas" id="abas" role="group" aria-label="Categoria"></div>
    <section id="conteudo" aria-live="polite"></section>
  </main>
  <aside class="ficha" aria-label="Som escolhido">
    <div>
      <p class="rotulo">Tocando</p>
      <h2 id="f-nome">Nada ainda</h2>
      <p class="sub" id="f-desc">Escolha um som ao lado.</p>
    </div>
    <canvas class="onda" id="onda" width="680" height="172" aria-label="Forma de onda do som"></canvas>
    <div class="controles">
      <button class="btn" id="b-tocar" disabled>Tocar</button>
      <button class="btn sec" id="b-parar" disabled>Parar</button>
      <label class="toggle"><input type="checkbox" id="c-laco" checked> Repetir os laços</label>
    </div>
    <div class="vol"><span>Volume</span><input type="range" id="r-vol" min="0" max="100" value="70" aria-label="Volume"><span id="v-vol">70%</span></div>
    <dl class="dados" id="f-dados"></dl>
    <div id="f-cred"></div>
    <p class="nota" id="nota-geral"></p>
  </aside>
</div>
<script type="module">
const BASE = 'sons/';
const FORMATO = (() => { try { return new Audio().canPlayType('audio/ogg; codecs="vorbis"') ? 'ogg' : 'mp3'; } catch (e) { return 'mp3'; } })();
const estado = { pronto: false, erros: [], decodificados: 0, tocando: null, ultimaFala: null, falas: 0 };
window.__sons = estado;
let M = null, ctx = null, mestre = null, volume = 0.7, catAtual = 'interface';
let atual = null;           // { id, fontes, ganhos, inicio, buffer, tipo }
let escolhido = null;       // id do som na ficha
const cache = new Map();
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...filhos) => { const e = document.createElement(tag); Object.assign(e, props); for (const f of filhos) e.append(f); return e; };
const fmtDur = (s) => s >= 60 ? `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}` : `${s.toFixed(s < 10 ? 2 : 1)} s`;
const ICONE_PLAY = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1 L11 6 L2 11 Z"/></svg>';
const ICONE_STOP = '<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx="1"/></svg>';

function garantirCtx() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    mestre = ctx.createGain();
    mestre.gain.value = volume;
    mestre.connect(ctx.destination);
  }
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}
// as falas gravadas vêm juntas, em MP3, num pacote por idade e sexo (sons/voz_pacotes/<grupo>.json): o artefato publicado
// tem limite de arquivos; os outros sons vêm um por arquivo
const _pacotesVoz = new Map();
async function bytesVoz(arquivo) {
  const nome = arquivo.slice(4), grupo = nome.replace(/_[^_]+_[0-9]+$/, '');
  if (!_pacotesVoz.has(grupo)) _pacotesVoz.set(grupo, fetch(`${BASE}voz_pacotes/${grupo}.json`).then((r) => { if (!r.ok) throw new Error(`${grupo}: ${r.status}`); return r.json(); }));
  const b64 = (await _pacotesVoz.get(grupo))[nome];
  if (!b64) throw new Error(`${arquivo}: fora do pacote`);
  return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)).buffer;
}
// interface, casa e bichos (sons curtos) vêm num pacote por categoria e formato (sons/pacotes/<cat>_<formato>.json)
const PACOTES_CAT = ['interface', 'casa', 'bichos'];
const _pacotesCat = new Map();
async function bytesPacote(cat, arquivo) {
  const k = cat + '_' + FORMATO;
  if (!_pacotesCat.has(k)) _pacotesCat.set(k, fetch(`${BASE}pacotes/${k}.json`).then((r) => { if (!r.ok) throw new Error(`${k}: ${r.status}`); return r.json(); }));
  const b64 = (await _pacotesCat.get(k))[arquivo];
  if (!b64) throw new Error(`${arquivo}: fora do pacote`);
  return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)).buffer;
}
function carregar(arquivo) {
  if (!cache.has(arquivo)) {
    const cat = arquivo.split('/')[0];
    const bytes = arquivo.startsWith('voz/') ? bytesVoz(arquivo) : PACOTES_CAT.includes(cat) ? bytesPacote(cat, arquivo)
      : fetch(`${BASE}${arquivo}.${FORMATO}`).then((r) => { if (!r.ok) throw new Error(`${arquivo}: ${r.status}`); return r.arrayBuffer(); });
    cache.set(arquivo, bytes
      .then((b) => ctx.decodeAudioData(b))
      .then((buf) => { estado.decodificados++; return buf; })
      .catch((e) => { cache.delete(arquivo); estado.erros.push(String(e)); throw e; }));
  }
  return cache.get(arquivo);
}

// ---------------------------------------------------------------- tocar e parar
function parar(suave = 0.04) {
  if (!atual) return;
  const t = ctx.currentTime;
  for (const g of atual.ganhos) { g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t); g.gain.linearRampToValueAtTime(0, t + suave); }
  for (const f of atual.fontes) { try { f.stop(t + suave + 0.01); } catch (e) { /* ainda não começou */ } }
  if (atual.aoParar) atual.aoParar();
  atual = null;
  estado.tocando = null;
  marcarTocando();
}
function fonte(buffer, laco, quando, destino = mestre) {
  const f = ctx.createBufferSource();
  f.buffer = buffer;
  f.loop = laco;
  const g = ctx.createGain();
  f.connect(g).connect(destino);
  f.start(quando);
  return [f, g];
}
async function tocar(id) {
  garantirCtx();
  const s = M.sons[id];
  parar();
  const buf = await carregar(s.arquivo);
  const quando = ctx.currentTime + 0.02;
  const [f, g] = fonte(buf, s.laco && $('c-laco').checked, quando);
  const este = { id, fontes: [f], ganhos: [g], inicio: quando, buffer: buf, tipo: 'som' };
  f.onended = () => { if (atual === este) { atual = null; estado.tocando = null; marcarTocando(); } };
  atual = este;
  estado.tocando = id;
  marcarTocando();
  return este;
}
function marcarTocando() {
  document.querySelectorAll('[data-som]').forEach((b) => {
    const on = !!atual && atual.id === b.dataset.som;
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    const p = b.querySelector('.play'); if (p) p.innerHTML = on ? ICONE_STOP : ICONE_PLAY;
  });
  document.querySelectorAll('.musica').forEach((c) => { c.dataset.tocando = String(!!atual && atual.tipo === 'musica' && atual.nome === c.dataset.musica); });
  $('b-parar').disabled = !atual;
}

// ---------------------------------------------------------------- ficha
function mostrarFicha(id) {
  garantirCtx();
  escolhido = id;
  const s = M.sons[id];
  $('f-nome').textContent = s.nome;
  $('f-desc').textContent = s.texto ? `“${s.texto}”` : (s.descricao || '');
  $('b-tocar').disabled = false;
  const d = $('f-dados');
  d.replaceChildren();
  const linhas = [['Duração', fmtDur(s.dur)], ['Arquivo', `${s.arquivo}.ogg / .mp3`], ['Canais', s.canais === 2 ? 'estéreo' : 'mono'],
    ['Laço', s.laco ? 'sim, sem emenda' : 'não'], ['Origem', s.origem === 'sintetizado' ? 'sintetizado por código' : 'pacote CC0']];
  if (s.medidas) {
    linhas.push(['Loudness', `${s.medidas.lufs} LUFS (alvo ${s.alvo_lufs})`]);
    linhas.push(['Pico real', `${s.medidas.pico_real_dbtp} dBTP`]);
  }
  if (s.bpm) linhas.push(['Andamento', `${s.bpm} bpm, 4/4`]);
  for (const [k, v] of linhas) d.append(el('dt', { textContent: k }), el('dd', { textContent: v }));
  const c = $('f-cred');
  c.replaceChildren();
  for (const cid of s.creditos) {
    const cr = M.creditos[cid];
    if (!cr) continue;
    const box = el('div', { className: 'cred' });
    box.innerHTML = '';
    box.append(el('strong', { textContent: 'Crédito: ' }), `“${cr.titulo}”, de ${cr.autor} (arquivo ${cr.arquivo_original}). `,
      el('a', { href: cr.url, target: '_blank', rel: 'noopener', textContent: 'OpenGameArt' }), ' · ',
      el('a', { href: cr.licenca_url, target: '_blank', rel: 'noopener', textContent: cr.licenca }));
    c.append(box);
  }
  carregar(s.arquivo).then(desenharOnda).catch(() => {});
}
function desenharOnda(buf) {
  const cv = $('onda'), g = cv.getContext('2d', { willReadFrequently: true });
  const W = cv.width, H = cv.height;
  g.clearRect(0, 0, W, H);
  const dados = buf.getChannelData(0);
  const passo = Math.max(1, Math.floor(dados.length / W));
  g.fillStyle = '#5b63a8';
  for (let x = 0; x < W; x++) {
    let mn = 1, mx = -1;
    for (let i = x * passo; i < Math.min(dados.length, (x + 1) * passo); i++) { const v = dados[i]; if (v < mn) mn = v; if (v > mx) mx = v; }
    g.fillRect(x, H / 2 - mx * H * 0.46, 1, Math.max(1, (mx - mn) * H * 0.46));
  }
  cv._buf = buf;
  cv._img = null;
}
function animar() {
  const cv = $('onda');
  if (atual && atual.tipo === 'som' && cv._buf === atual.buffer && atual.id === escolhido) {
    const g = cv.getContext('2d', { willReadFrequently: true });
    if (!cv._img) cv._img = g.getImageData(0, 0, cv.width, cv.height);
    g.putImageData(cv._img, 0, 0);
    const dur = atual.buffer.duration;
    let t = ctx.currentTime - atual.inicio;
    if (atual.fontes[0].loop) t = ((t % dur) + dur) % dur;
    const x = Math.min(1, Math.max(0, t / dur)) * cv.width;
    g.fillStyle = '#7fd8be';
    g.fillRect(x, 0, 3, cv.height);
  } else if (cv._img) { cv._img = null; if (cv._buf) desenharOnda(cv._buf); }
  if (bocaAtiva) atualizarBoca();
  requestAnimationFrame(animar);
}

// ---------------------------------------------------------------- categorias de sons
function cartaoSom(id) {
  const s = M.sons[id];
  const b = el('button', { className: 'som', type: 'button' });
  b.dataset.som = id;
  b.setAttribute('aria-pressed', 'false');
  b.id = 'som-' + id.replace('/', '-');
  const meta = el('span', { className: 'meta' }, fmtDur(s.dur));
  if (s.laco) meta.append(el('span', { className: 'selo laco', textContent: 'laço' }));
  if (s.origem !== 'sintetizado') meta.append(el('span', { className: 'selo cc0', textContent: 'CC0' }));
  const play = el('span', { className: 'play' }); play.innerHTML = ICONE_PLAY;
  b.append(play, el('span', { className: 'txt' }, el('span', { className: 'nome', textContent: s.nome, title: s.nome }), meta));
  b.addEventListener('click', () => {
    if (atual && atual.id === id) { parar(); return; }
    mostrarFicha(id);
    tocar(id).catch((e) => estado.erros.push(String(e)));
  });
  return b;
}
function mostrarCategoria(cid) {
  catAtual = cid;
  document.querySelectorAll('#abas button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.cat === cid)));
  const cat = M.categorias.find((c) => c.id === cid);
  const box = $('conteudo');
  box.replaceChildren();
  if (cid === 'creditos') return mostrarCreditos(box);
  const origem = cat.cc0 ? ` ${cat.sintetizados} sintetizados, ${cat.cc0} de pacotes CC0.` : ` Todos os ${cat.sintetizados} sintetizados por código.`;
  box.append(el('p', { className: 'desc-cat', textContent: cat.descricao + origem }));
  if (cid === 'voz') return mostrarVoz(box);
  if (cid === 'musica') return mostrarMusica(box, cat);
  for (const gr of cat.grupos) {
    box.append(el('h3', { textContent: gr.nome || 'Outros' }));
    const g = el('div', { className: 'grade' });
    for (const id of gr.sons) g.append(cartaoSom(id));
    box.append(g);
  }
  marcarTocando();
}
function mostrarCreditos(box) {
  box.append(el('p', { className: 'desc-cat', textContent: 'Arquivos de terceiros usados na biblioteca. Só entram itens com licença CC0 (domínio público) conferida na ficha do OpenGameArt; tudo o mais foi sintetizado por código.' }));
  const lista = el('div', { className: 'lista-cred' });
  for (const [cid, cr] of Object.entries(M.creditos)) {
    const box2 = el('div', { className: 'cred' });
    box2.append(el('strong', { textContent: cr.titulo }), ` · ${cr.autor} · arquivo ${cr.arquivo_original}`, el('br'),
      el('a', { href: cr.url, target: '_blank', rel: 'noopener', textContent: cr.url }), ' · ',
      el('a', { href: cr.licenca_url, target: '_blank', rel: 'noopener', textContent: cr.licenca }), el('br'),
      el('span', { className: 'meta', textContent: 'Usado em: ' + cr.usado_em.map((i) => M.sons[i]?.nome || i).join(', ') }));
    lista.append(box2);
  }
  box.append(lista);
}

// ---------------------------------------------------------------- voz inventada
const IDADES = [['bebe', 'Bebê'], ['crianca', 'Criança'], ['adulto', 'Adulto'], ['idoso', 'Idoso']];
const SEXOS = [['f', 'Feminina'], ['m', 'Masculina']];
const NOMES_EMO = { neutro: 'Neutro', feliz: 'Feliz', triste: 'Triste', bravo: 'Bravo', surpreso: 'Surpreso', rindo: 'Rindo', sono: 'Sono', choro: 'Choro de bebê', balbucio: 'Balbucio' };
const EMO_IDADE = { bebe: ['choro', 'balbucio', 'rindo'], crianca: ['neutro', 'feliz', 'triste', 'bravo', 'surpreso', 'rindo', 'sono'] };
EMO_IDADE.adulto = EMO_IDADE.crianca; EMO_IDADE.idoso = EMO_IDADE.crianca;
const vozSel = { idade: 'adulto', sexo: 'f', emocao: 'feliz' };
let modVoz = null, bocaJson = null, bocaAtiva = null;
async function moduloVoz() { if (!modVoz) modVoz = await import('./' + BASE + M.voz.modulo); return modVoz; }
async function dadosBoca() { if (!bocaJson) bocaJson = await (await fetch(BASE + M.voz.boca)).json(); return bocaJson; }

function grupoBotoes(opcoes, valor, aoMudar, rotulo, classe = 'chips') {
  const g = el('div', { className: classe, role: 'group' });
  g.setAttribute('aria-label', rotulo);
  for (const [v, n] of opcoes) {
    const b = el('button', { type: 'button', textContent: n });
    b.dataset.valor = v;
    b.id = `voz-${rotulo.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()}-${v}`;
    b.setAttribute('aria-pressed', String(v === valor));
    b.addEventListener('click', () => aoMudar(v));
    g.append(b);
  }
  return g;
}
function rostoSvg() {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 200 214'); svg.setAttribute('class', 'rosto'); svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Boca sincronizada com a fala');
  svg.innerHTML = `<circle cx="100" cy="100" r="88" fill="#f2c9a0"/><circle cx="70" cy="80" r="9" fill="#2b2140"/><circle cx="130" cy="80" r="9" fill="#2b2140"/>
    <circle cx="52" cy="112" r="11" fill="#f4a3bf" opacity=".55"/><circle cx="148" cy="112" r="11" fill="#f4a3bf" opacity=".55"/>
    <ellipse id="boca" cx="100" cy="135" rx="22" ry="3" fill="#7a2338"/><rect id="dentes" x="88" y="126" width="24" height="6" rx="2" fill="#fff" opacity="0"/>
    <text id="forma-boca" x="100" y="208" text-anchor="middle" font-size="12" fill="#a9aed8" font-family="Figtree, sans-serif"></text>`;
  return svg;
}
// forma → largura (rx) base e abertura máxima (ry)
const FORMAS = { X: [20, 2], M: [18, 1], A: [24, 26], E: [26, 15], I: [30, 9], O: [13, 18], F: [22, 4] };
function pintarBoca(abertura, forma) {
  const b = document.getElementById('boca'); if (!b) return;
  const [rx, ry] = FORMAS[forma] || FORMAS.E;
  b.setAttribute('rx', String(rx * (0.85 + 0.15 * abertura)));
  b.setAttribute('ry', String(Math.max(1.5, ry * abertura + (forma === 'M' || forma === 'X' ? 1.5 : 2))));
  document.getElementById('dentes').setAttribute('opacity', forma === 'F' && abertura > 0.1 ? '1' : '0');
  document.getElementById('forma-boca').textContent = abertura > 0.05 ? `forma ${forma} · ${Math.round(abertura * 100)}%` : '';
}
function atualizarBoca() {
  const b = bocaAtiva;
  const t = ctx.currentTime - b.inicio;
  if (t > b.dur + 0.1) { bocaAtiva = null; pintarBoca(0, 'X'); return; }
  const q = t * b.boca.fps;
  if (q < 0) return pintarBoca(0, 'X');
  const i = Math.floor(q), u = q - i;
  const a = b.boca.amp[i] ?? 0, a2 = b.boca.amp[i + 1] ?? a;
  pintarBoca(a + (a2 - a) * u, b.boca.forma[i] || 'X');
}
function mostrarVoz(box) {
  const campos = el('div', { className: 'campos' });
  const redesenhar = () => mostrarCategoria('voz');
  campos.append(el('p', { className: 'rotulo', textContent: 'Idade' }),
    grupoBotoes(IDADES, vozSel.idade, (v) => { vozSel.idade = v; if (!EMO_IDADE[v].includes(vozSel.emocao)) vozSel.emocao = EMO_IDADE[v][0]; redesenhar(); }, 'Idade', 'seg'),
    el('p', { className: 'rotulo', textContent: 'Voz' }),
    grupoBotoes(SEXOS, vozSel.sexo, (v) => { vozSel.sexo = v; redesenhar(); }, 'Voz', 'seg'),
    el('p', { className: 'rotulo', textContent: 'Emoção' }),
    grupoBotoes(EMO_IDADE[vozSel.idade].map((e) => [e, NOMES_EMO[e]]), vozSel.emocao, (v) => { vozSel.emocao = v; redesenhar(); }, 'Emoção'));
  const btn = el('button', { className: 'btn', id: 'b-falar', type: 'button', textContent: 'Gerar e falar ao vivo' });
  const legenda = el('div', { className: 'legenda', id: 'legenda', textContent: estado.ultimaFala ? estado.ultimaFala.texto : '' });
  btn.addEventListener('click', async () => {
    try {
      garantirCtx();
      parar();
      const mv = await moduloVoz();
      const fala = mv.falar(ctx, { ...vozSel, semente: Math.floor(Math.random() * 1e9) }, mestre);
      atual = { id: null, fontes: [fala.fonte], ganhos: [fala.ganho], inicio: fala.inicio, tipo: 'fala' };
      bocaAtiva = { boca: fala.boca, inicio: fala.inicio, dur: fala.duracao };
      estado.ultimaFala = { texto: fala.texto, dur: fala.duracao, quadros: fala.boca.amp.length, ...vozSel };
      estado.falas++;
      legenda.textContent = fala.texto;
      $('f-nome').textContent = 'Fala ao vivo';
      $('f-desc').textContent = `“${fala.texto}” · ${fala.duracao.toFixed(2)} s, gerada agora no navegador`;
      marcarTocando();
    } catch (e) { estado.erros.push(String(e)); console.error(e); }
  });
  campos.append(el('div', {}, btn), legenda);
  const v = el('div', { className: 'voz' }, campos, rostoSvg());
  box.append(v);
  const combo = `${vozSel.idade}_${vozSel.sexo}_${vozSel.emocao}`;
  const ids = M.voz.frases[combo] || [];
  box.append(el('h3', { textContent: `Frases gravadas: ${ids.length} para esta combinação` }));
  const lista = el('div', { className: 'frases' });
  for (const id of ids) {
    const s = M.sons[id];
    const b = el('button', { className: 'frase', type: 'button', textContent: s.texto, title: s.texto });
    b.dataset.som = id;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', async () => {
      if (atual && atual.id === id) { parar(); return; }
      mostrarFicha(id);
      const [este, bj] = await Promise.all([tocar(id), dadosBoca()]);
      const bk = bj[s.id];
      if (bk) bocaAtiva = { boca: bk, inicio: este.inicio + (bk.inicio_s || 0), dur: este.buffer.duration };
      legenda.textContent = s.texto;
    });
    lista.append(b);
  }
  box.append(lista);
  box.append(el('p', { className: 'nota', textContent: 'A boca segue o envelope de amplitude por quadro (30 por segundo) e a forma do fonema: X repouso, M fechada, A aberta, E média, I estreita, O redonda, F dentes no lábio. No jogo, o mesmo módulo (sons/voz/morada_voz.js) gera a fala sem arquivos e devolve esse envelope.' }));
  pintarBoca(0, 'X');
  marcarTocando();
}

// ---------------------------------------------------------------- música: início → laço → fim
function mostrarMusica(box) {
  const nomes = [...new Set(Object.values(M.sons).filter((s) => s.cat === 'musica').map((s) => s.musica))];
  const grade = el('div', { className: 'musicas' });
  for (const nome of nomes) {
    const laco = M.sons[`musica/${nome}_laco`], ini = M.sons[`musica/${nome}_inicio`], fim = M.sons[`musica/${nome}_fim`];
    const card = el('div', { className: 'musica' });
    card.dataset.musica = nome;
    const estadoTxt = el('div', { className: 'estado' });
    const bInicio = el('button', { className: 'principal', type: 'button', textContent: 'Tocar com início', id: `mus-${nome}-tocar` });
    const bFim = el('button', { type: 'button', textContent: 'Terminar', id: `mus-${nome}-fim` });
    const bLaco = el('button', { type: 'button', textContent: 'Só o laço', id: `mus-${nome}-laco` });
    bInicio.addEventListener('click', () => tocarMusica(nome, true, estadoTxt).catch((e) => estado.erros.push(String(e))));
    bLaco.addEventListener('click', () => tocarMusica(nome, false, estadoTxt).catch((e) => estado.erros.push(String(e))));
    bFim.addEventListener('click', () => terminarMusica(nome, estadoTxt).catch((e) => estado.erros.push(String(e))));
    card.append(el('div', { className: 'titulo', textContent: laco.titulo }),
      el('div', { className: 'info', textContent: `${laco.descricao} ${laco.bpm} bpm · laço de ${fmtDur(laco.dur)}` }),
      el('div', { className: 'acoes' }, bInicio, bLaco, bFim), estadoTxt);
    grade.append(card);
  }
  box.append(grade);
  box.append(el('h3', { textContent: 'Partes, uma a uma' }));
  const g = el('div', { className: 'grade' });
  for (const id of Object.keys(M.sons).filter((k) => k.startsWith('musica/'))) g.append(cartaoSom(id));
  box.append(g);
  marcarTocando();
}
async function tocarMusica(nome, comInicio, estadoTxt) {
  garantirCtx();
  parar();
  const sl = M.sons[`musica/${nome}_laco`], si = M.sons[`musica/${nome}_inicio`];
  const [bl, bi] = await Promise.all([carregar(sl.arquivo), carregar(si.arquivo)]);
  carregar(M.sons[`musica/${nome}_fim`].arquivo).catch(() => {});
  const t0 = ctx.currentTime + 0.05;
  const fontes = [], ganhos = [];
  let tLaco = t0;
  if (comInicio) { const [f, g] = fonte(bi, false, t0); fontes.push(f); ganhos.push(g); tLaco = t0 + si.entrada_do_laco_s; }
  const [fl, gl] = fonte(bl, true, tLaco);
  fontes.push(fl); ganhos.push(gl);
  mostrarFicha(`musica/${nome}_laco`);
  atual = { id: null, nome, tipo: 'musica', fontes, ganhos, inicio: tLaco, buffer: bl, laco: fl, ganhoLaco: gl, bpm: sl.bpm, estadoTxt };
  estado.tocando = `musica:${nome}`;
  const meu = atual;
  const tic = () => {
    if (atual !== meu) return;
    const t = ctx.currentTime - meu.inicio;
    const compasso = 4 * 60 / meu.bpm;
    estadoTxt.textContent = t < 0 ? `início… o laço entra em ${(-t).toFixed(1)} s` : `laço · compasso ${Math.floor((t % bl.duration) / compasso) + 1} de ${Math.round(bl.duration / compasso)}`;
    setTimeout(tic, 200);
  };
  tic();
  meu.aoParar = () => { estadoTxt.textContent = ''; };
  marcarTocando();
}
async function terminarMusica(nome, estadoTxt) {
  if (!atual || atual.tipo !== 'musica' || atual.nome !== nome) return;
  const meu = atual;
  const bf = await carregar(M.sons[`musica/${nome}_fim`].arquivo);
  const compasso = 4 * 60 / meu.bpm;
  const agora = ctx.currentTime;
  const t = Math.max(0, agora - meu.inicio);
  let tFim = meu.inicio + Math.ceil((t + 0.15) / compasso) * compasso;   // próximo começo de compasso
  if (tFim < agora + 0.1) tFim += compasso;
  const [ff, gf] = fonte(bf, false, tFim);
  meu.fontes.push(ff); meu.ganhos.push(gf);
  meu.ganhoLaco.gain.setValueAtTime(1, tFim);
  meu.ganhoLaco.gain.linearRampToValueAtTime(0, tFim + 0.08);
  meu.laco.stop(tFim + 0.1);
  for (const f of meu.fontes.slice(0, -2)) { try { f.stop(tFim + 0.1); } catch (e) { /* já acabou */ } }
  estadoTxt.textContent = `terminando no próximo compasso`;
  ff.onended = () => { if (atual === meu) { atual = null; estado.tocando = null; estadoTxt.textContent = ''; marcarTocando(); } };
  estado.terminando = nome;
}

// ---------------------------------------------------------------- controles da ficha
$('b-tocar').addEventListener('click', () => { if (escolhido) tocar(escolhido).catch((e) => estado.erros.push(String(e))); });
$('b-parar').addEventListener('click', () => { parar(); bocaAtiva = null; pintarBoca(0, 'X'); });
$('c-laco').addEventListener('change', (e) => { if (atual && atual.tipo === 'som' && M.sons[atual.id].laco) atual.fontes[0].loop = e.target.checked; });
$('r-vol').addEventListener('input', (e) => {
  volume = e.target.value / 100;
  $('v-vol').textContent = `${e.target.value}%`;
  if (mestre) mestre.gain.setTargetAtTime(volume, ctx.currentTime, 0.02);
});

async function iniciar() {
  try {
    M = await (await fetch(BASE + 'sons.json')).json();
  } catch (e) {
    $('sub').textContent = 'Não consegui carregar sons/sons.json.';
    estado.erros.push(String(e));
    return;
  }
  const total = Object.keys(M.sons).length;
  const nS = M.categorias.reduce((a, c) => a + c.sintetizados, 0), nC = M.categorias.reduce((a, c) => a + c.cc0, 0);
  $('sub').textContent = `${total} sons em OGG e MP3 a 44,1 kHz: ${nS} sintetizados por código e ${nC} de pacotes CC0. Efeitos a −16 LUFS, músicas a −20.`;
  $('nota-geral').textContent = `Tocando em ${FORMATO.toUpperCase()}. Os laços repetem sem emenda; desligue "Repetir os laços" para ouvir uma volta só. Créditos de terceiros na aba Créditos.`;
  const abas = $('abas');
  for (const c of [...M.categorias, { id: 'creditos', nome: 'Créditos' }]) {
    const n = c.id === 'creditos' ? Object.keys(M.creditos).length : c.grupos.reduce((a, g) => a + g.sons.length, 0);
    const b = el('button', { type: 'button', id: 'aba-' + c.id }, c.nome, el('span', { className: 'n', textContent: String(n) }));
    b.dataset.cat = c.id;
    b.addEventListener('click', () => mostrarCategoria(c.id));
    abas.append(b);
  }
  let inicial = 'interface';
  try { inicial = localStorage.getItem('morada-sons-aba') || inicial; } catch (e) { /* sem armazenamento */ }
  if (![...M.categorias.map((c) => c.id), 'creditos'].includes(inicial)) inicial = 'interface';
  mostrarCategoria(inicial);
  abas.addEventListener('click', () => { try { localStorage.setItem('morada-sons-aba', catAtual); } catch (e) { /* sem armazenamento */ } });
  requestAnimationFrame(animar);
  estado.pronto = true;
}
iniciar();
