<title>Projeto Recreio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: coluna de 1120px como o corredor de uma bilheteria; os contratos centrais (ingresso, planos, posse) aparecem como canhotos picotados; telas do produto em molduras 960×600 que escalam */
:root{
  --bg:#F2F4FB; --surface:#FFFFFF; --surface-2:#E8ECF8; --line:#D3D9EC;
  --ink:#161A33; --muted:#59607F;
  --sun:#FFC233; --sun-ink:#5A3D00; --coral:#F0524F; --sea:#0E9C92; --sky:#3F6BE8; --grape:#7A4FD1;
  --sun-soft:#FFF1C9; --coral-soft:#FFE0DE; --sea-soft:#D3F2EF; --sky-soft:#DFE7FF; --grape-soft:#ECE3FF;
  --code-bg:#161A33; --code-ink:#E8EBFA;
  --f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1226; --surface:#171B36; --surface-2:#1F2445; --line:#2E3560;
  --ink:#EEF0FF; --muted:#A3A9CC;
  --sun:#FFCB4D; --sun-ink:#2A1C00; --coral:#FF7A76; --sea:#3FD0C3; --sky:#86A4FF; --grape:#B597FF;
  --sun-soft:#3A2F12; --coral-soft:#3D1D23; --sea-soft:#0F3634; --sky-soft:#1D2A58; --grape-soft:#2C2150;
  --code-bg:#0A0C1C; --code-ink:#E8EBFA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1226; --surface:#171B36; --surface-2:#1F2445; --line:#2E3560;
  --ink:#EEF0FF; --muted:#A3A9CC;
  --sun:#FFCB4D; --sun-ink:#2A1C00; --coral:#FF7A76; --sea:#3FD0C3; --sky:#86A4FF; --grape:#B597FF;
  --sun-soft:#3A2F12; --coral-soft:#3D1D23; --sea-soft:#0F3634; --sky-soft:#1D2A58; --grape-soft:#2C2150;
  --code-bg:#0A0C1C; --code-ink:#E8EBFA; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.15}
h1,h2{font-family:var(--f-display);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(27px,3.6vw,40px)}
h3{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.01em}
h4{font-size:16.5px;font-weight:700}
p{margin:0}
a{color:var(--sky)}
code{font-family:var(--f-mono);font-size:.84em;background:var(--surface-2);padding:.08em .36em;border-radius:5px}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.small{font-size:14.5px}
.muted{color:var(--muted)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:18px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--ink);text-decoration:none;flex:none;letter-spacing:-.02em}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;color:var(--muted);font-weight:700;font-size:13.5px;padding:6px 10px;border-radius:999px}
.nav a:hover{background:var(--surface-2);color:var(--ink)}

.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 72px}
section{scroll-margin-top:68px;padding-block:68px 4px;display:grid;gap:24px}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--c,var(--sky))}
.eyebrow::before{content:"";width:14px;height:14px;border-radius:4px;background:var(--c,var(--sky));-webkit-mask:radial-gradient(circle at 50% 0,transparent 3px,#000 3.5px) top/100% 50% no-repeat,linear-gradient(#000,#000) bottom/100% 50% no-repeat;mask:radial-gradient(circle at 50% 0,transparent 3px,#000 3.5px) top/100% 50% no-repeat,linear-gradient(#000,#000) bottom/100% 50% no-repeat}
.sec-head{display:grid;gap:12px;max-width:820px}
.lead{font-size:19px;max-width:66ch}
.prose{max-width:70ch;display:grid;gap:12px}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:9px;align-content:start;min-width:0}
.card.tint{background:var(--soft,var(--surface-2));border-color:transparent}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft,var(--surface-2));color:var(--c,var(--ink));white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
ul.list,ol.list{margin:0;padding-left:20px;display:grid;gap:6px}

/* canhoto: o desenho do "ingresso" para os contratos centrais */
.stub{position:relative;background:var(--surface);border-radius:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;min-width:0;border:1px solid var(--line)}
.stub>.main{padding:20px 22px;display:grid;gap:10px;min-width:0}
.stub>.side{padding:20px 22px;display:grid;gap:4px;align-content:center;justify-items:center;border-left:2px dashed var(--line);min-width:130px;text-align:center}
.stub .big{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
@media (max-width:620px){.stub{grid-template-columns:1fr}.stub>.side{border-left:0;border-top:2px dashed var(--line)}}

/* hero */
.hero{padding-block:40px 4px;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);align-items:center;gap:36px}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(60px,9.5vw,118px);line-height:.88;letter-spacing:-.045em}
.hero h1 .dot{color:var(--coral)}
.hero .tagline{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,2.6vw,28px);line-height:1.2;letter-spacing:-.01em;max-width:24ch}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.shelf{display:grid;grid-template-columns:1.55fr 1fr;gap:12px;min-width:0}
.cover{position:relative;border-radius:18px;overflow:hidden;min-height:330px;background:var(--surface-2);color:#fff;display:flex;align-items:flex-end}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,12,30,0) 40%,rgba(10,12,30,.82))}
.cover .cap{position:relative;z-index:1;padding:18px;display:grid;gap:4px}
.cover .cap b{font-family:var(--f-display);font-weight:800;font-size:32px;letter-spacing:-.02em;line-height:1}
.cover .cap small{font-size:13.5px;opacity:.9}
.cover .badge{position:absolute;left:14px;top:14px;z-index:1;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:#FFC233;color:#3A2700}
.next{display:grid;gap:12px;align-content:stretch}
.next>div{border:2px dashed var(--line);border-radius:18px;padding:16px;display:grid;align-content:end;gap:4px;color:var(--muted);font-size:13.5px}
.next>div b{font-family:var(--f-display);font-size:18px;color:var(--ink)}

/* tabelas */
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.tbl table{min-width:680px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:11px 15px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.k-ok{color:var(--sea);font-weight:700}.k-mid{color:var(--muted);font-weight:700}.k-no{color:var(--coral);font-weight:700}

/* código */
pre{margin:0;background:var(--code-bg);color:var(--code-ink);font-family:var(--f-mono);font-size:12.8px;line-height:1.6;padding:18px 20px;border-radius:14px;overflow-x:auto;min-width:0}
pre .c{color:#8A90B8} pre .k{color:#FF9E9B} pre .s{color:#7EE3D8} pre .n{color:#FFD166}
.code-head{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--muted);font-weight:700;padding:0 4px;font-family:var(--f-mono)}
pre.mermaid{background:var(--surface);color:var(--ink);border:1px solid var(--line);text-align:center;font-family:var(--f-body)}

.callout{border-radius:16px;padding:18px 20px;background:var(--soft,var(--sun-soft));display:grid;gap:8px}
.callout b.t{font-family:var(--f-display);font-size:18px}
.caption{font-size:14px;color:var(--muted);max-width:78ch}

/* diferenças: revisão x esta versão */
.diff{display:grid;gap:12px}
.diff>div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.diff>div>*{padding:14px 18px;min-width:0}
.diff>div>:first-child{background:var(--surface-2)}
.diff .lab{display:block;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:4px}
.diff h4{font-family:var(--f-display);font-size:17px;margin-bottom:4px}
@media (max-width:720px){.diff>div{grid-template-columns:1fr}}

/* planos */
.toggle{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px;justify-self:start}
.toggle button{font:inherit;font-weight:700;font-size:14px;border:0;border-radius:999px;padding:8px 16px;background:transparent;color:var(--muted);cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:10px;align-content:start}
.plan.hl{border:2px solid var(--ink)}
.plan .price{font-family:var(--f-display);font-weight:800;font-size:36px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.plan .price small{font-family:var(--f-body);font-size:14px;font-weight:700;color:var(--muted);letter-spacing:0}
.plan .per{font-size:13.5px;color:var(--muted);min-height:21px}
.plan ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14.5px}
.plan li{display:grid;grid-template-columns:18px 1fr;gap:6px}
.plan li::before{content:"✓";color:var(--sea);font-weight:700}
.plan li.off::before{content:"–";color:var(--muted)}
.plan li.off{color:var(--muted)}

/* calculadora */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.calc{grid-template-columns:1fr}}
.calc form{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.calc label{display:grid;gap:4px;font-size:14px;font-weight:700}
.calc label span{font-weight:400;color:var(--muted);font-size:13px}
.calc input,.calc select{font:inherit;font-size:15px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums;width:100%}
.calc .out{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:4px;align-content:start}
.calc .row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.calc .row:last-of-type{border-bottom:0}
.calc .tot{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1.05;font-variant-numeric:tabular-nums}
.meter{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden;display:flex}
.meter i{display:block;height:100%}

/* roteiro */
.road{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
.mark{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:8px;align-content:start}
.mark .n{font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--c);letter-spacing:.02em}
.mark ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14.5px}
.mark .gate{font-size:13.5px;background:var(--surface-2);border-radius:10px;padding:9px 11px}

/* galeria de telas */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tabs button{flex:none;font:inherit;font-weight:700;font-size:14px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.shot{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.shot{grid-template-columns:1fr}}
.screen-wrap{position:relative;width:100%;max-width:100%;aspect-ratio:16/10;border-radius:18px;overflow:hidden;background:#0C0E1F;box-shadow:0 22px 44px -22px rgba(12,14,40,.55)}
.screen{position:absolute;left:0;top:0;width:960px;height:600px;transform:scale(var(--k,1));transform-origin:0 0;overflow:hidden;font-family:var(--f-body);font-size:14px;line-height:1.4;color:#EEF0FF;background:#0F1226}
.shot-note{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);padding:20px;border-radius:16px}
.shot-note ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14.5px}

footer{max-width:1120px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:var(--muted);font-size:14px;border-top:1px solid var(--line);display:grid;gap:8px}
footer ol{margin:0;padding-left:20px;display:grid;gap:3px}
@media (prefers-reduced-motion:no-preference){.hero h1 .dot{display:inline-block;animation:hop 2.8s ease-in-out infinite}@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-12px)}}}
</style>
