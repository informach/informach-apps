<script>
(function(){
  /* avatares do Recreio: desenhos próprios da plataforma, não personagens de jogo */
  var AV={
    lia:{bg:'#FFC233',pele:'#F2B89A',cabelo:'#B4532A',estilo:'chanel'},
    bruno:{bg:'#3FD0C3',pele:'#8D5A3C',cabelo:'#2B1B12',estilo:'curto'},
    tom:{bg:'#86A4FF',pele:'#E8B48F',cabelo:'#4A3222',estilo:'franja'},
    mel:{bg:'#FF7A76',pele:'#C98A63',cabelo:'#2B1B12',estilo:'tranças'},
    clara:{bg:'#B597FF',pele:'#F5CBB0',cabelo:'#E2B04A',estilo:'longo'},
    caio:{bg:'#7EE3A0',pele:'#5E3B28',cabelo:'#1A120C',estilo:'black'}
  };
  function avatar(k){var a=AV[k]||AV.lia,h=a.cabelo,s='';
    s+='<rect width="100" height="100" fill="'+a.bg+'"/>';
    if(a.estilo==='longo')s+='<path d="M24 52c0-22 12-34 26-34s26 12 26 34v40H24z" fill="'+h+'"/>';
    if(a.estilo==='chanel')s+='<path d="M22 56c0-24 12-38 28-38s28 14 28 38v12H22z" fill="'+h+'"/>';
    if(a.estilo==='tranças')s+='<rect x="20" y="50" width="10" height="34" rx="5" fill="'+h+'"/><rect x="70" y="50" width="10" height="34" rx="5" fill="'+h+'"/>';
    s+='<rect x="30" y="74" width="40" height="30" rx="14" fill="'+a.pele+'"/>';
    s+='<path d="M20 100c2-16 14-24 30-24s28 8 30 24z" fill="rgba(15,18,38,.28)"/>';
    s+='<ellipse cx="50" cy="52" rx="20" ry="23" fill="'+a.pele+'"/>';
    if(a.estilo==='curto')s+='<path d="M29 46c0-14 9-22 21-22s21 8 21 22c-6-6-14-8-21-8s-15 2-21 8z" fill="'+h+'"/>';
    if(a.estilo==='franja')s+='<path d="M28 50c-2-18 10-27 22-27s24 9 22 27c-4-8-12-12-22-12-6 0-10 4-14 4s-6-2-8 8z" fill="'+h+'"/>';
    if(a.estilo==='black')s+='<circle cx="50" cy="36" r="24" fill="'+h+'"/><ellipse cx="50" cy="54" rx="20" ry="21" fill="'+a.pele+'"/>';
    if(a.estilo==='chanel'||a.estilo==='longo')s+='<path d="M30 48c2-14 10-22 20-22s19 8 20 22c-8-8-14-10-20-14-4 6-12 10-20 14z" fill="'+h+'"/>';
    if(a.estilo==='tranças')s+='<path d="M29 48c0-15 9-23 21-23s21 8 21 23c-5-4-10-10-21-10s-16 6-21 10z" fill="'+h+'"/>';
    s+='<circle cx="42" cy="54" r="2.4" fill="#161A33"/><circle cx="58" cy="54" r="2.4" fill="#161A33"/>';
    s+='<path d="M43 63c4 4 10 4 14 0" fill="none" stroke="#161A33" stroke-width="2.4" stroke-linecap="round"/>';
    return '<svg viewBox="0 0 100 100" aria-hidden="true">'+s+'</svg>';}
  document.querySelectorAll('[data-av]').forEach(function(el){el.innerHTML=avatar(el.getAttribute('data-av'));});

  /* QR ilustrativo do pareamento (padrão determinístico, não decodificável) */
  document.querySelectorAll('canvas.qr').forEach(function(c){
    var x=c.getContext('2d'),n=25,u=c.width/(n+2),seed=0,t=c.dataset.seed||'R';
    for(var i=0;i<t.length;i++)seed=(seed*31+t.charCodeAt(i))>>>0;
    function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
    x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#0F1226';
    function finder(cx,cy){x.fillRect((cx+1)*u,(cy+1)*u,7*u,7*u);x.fillStyle='#fff';x.fillRect((cx+2)*u,(cy+2)*u,5*u,5*u);x.fillStyle='#0F1226';x.fillRect((cx+3)*u,(cy+3)*u,3*u,3*u);}
    for(var r=0;r<n;r++)for(var q=0;q<n;q++){var f=(r<8&&q<8)||(r<8&&q>n-9)||(r>n-9&&q<8);if(!f&&rnd()<.48)x.fillRect((q+1)*u,(r+1)*u,u,u);}
    finder(0,0);finder(n-7,0);finder(0,n-7);
  });

  /* galeria de telas */
  function fit(){document.querySelectorAll('.screen-wrap').forEach(function(w){if(w.clientWidth)w.style.setProperty('--k',w.clientWidth/960);});}
  var tabs=document.querySelectorAll('#tabs [role=tab]');
  tabs.forEach(function(t){t.addEventListener('click',function(){
    tabs.forEach(function(o){var on=o===t;o.setAttribute('aria-selected',String(on));document.getElementById(o.getAttribute('aria-controls')).hidden=!on;});fit();});});
  if(window.ResizeObserver)new ResizeObserver(fit).observe(document.getElementById('telas'));
  window.addEventListener('resize',fit);fit();

  /* mensal / anual */
  document.querySelectorAll('.toggle button').forEach(function(b){b.addEventListener('click',function(){
    var p=b.dataset.p;
    document.querySelectorAll('.toggle button').forEach(function(o){o.setAttribute('aria-pressed',String(o===b));});
    document.querySelectorAll('.plan .price[data-m]').forEach(function(el){el.innerHTML=el.dataset[p]+' <small>'+(p==='m'?'/mês':'/ano')+'</small>';});
    document.querySelectorAll('.plan .per[data-m]').forEach(function(el){el.textContent=el.dataset[p];});
  });});

  /* simulador de margem */
  var PLANOS={i:{p:59.90,meses:1},f:{p:127.90,meses:1},ia:{p:599,meses:12},fa:{p:1279,meses:12}};
  function brl(v){return (v<0?'− ':'')+'R$ '+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
  function num(id){var v=parseFloat(document.getElementById(id).value);return isFinite(v)&&v>0?v:0;}
  function calc(){
    var pl=PLANOS[document.getElementById('c-plano').value];
    var rec=pl.p/pl.meses;
    var tx=(pl.p*0.0399+0.39+pl.p*0.007)/pl.meses;
    var tr=rec*num('c-trib')/100;
    var cen=document.getElementById('c-cen').value,fr=1-Math.min(num('c-solo'),100)/100;
    function servidor(c){return num('c-horas')*(c==='h'?fr:1)*num('c-hora')+num('c-gb')*0.15;}
    var sv=servidor(cen),alt=servidor(cen==='h'?'a':'h');
    var su=num('c-sup');
    var mg=rec-tx-tr-sv-su,mgAlt=rec-tx-tr-alt-su;
    document.getElementById('o-alt-l').textContent=cen==='h'?'Margem com servidor autoritativo':'Margem no cenário híbrido';
    document.getElementById('o-alt').textContent=brl(mgAlt);
    document.getElementById('o-rec').textContent=brl(rec);
    document.getElementById('o-tx').textContent=brl(-tx);
    document.getElementById('o-tr').textContent=brl(-tr);
    document.getElementById('o-sv').textContent=brl(-sv);
    document.getElementById('o-su').textContent=brl(-su);
    var tot=document.getElementById('o-tot');tot.textContent=brl(mg);tot.style.color=mg<0?'var(--coral)':'var(--ink)';
    document.getElementById('o-pct').textContent=Math.round(mg/rec*100)+'% da receita';
    var parts=[['m-tx',tx],['m-tr',tr],['m-sv',sv],['m-su',su],['m-mg',Math.max(mg,0)]],sum=parts.reduce(function(a,b){return a+b[1];},0)||1;
    parts.forEach(function(p){document.getElementById(p[0]).style.width=(p[1]/sum*100)+'%';});
  }
  document.getElementById('calc').addEventListener('input',calc);
  document.getElementById('calc').addEventListener('submit',function(e){e.preventDefault();});
  calc();
})();
</script>
