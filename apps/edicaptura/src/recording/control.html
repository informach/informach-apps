<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; object-src 'none'; base-uri 'none'"><title>Controle de captura — EdiCaptura</title><link rel="stylesheet" href="../shared/base.css"><link rel="stylesheet" href="control.css"></head><body><header><span id="indicator"></span><strong id="title">Capturando</strong><span id="timer">00:00</span></header><section id="scroll-controls" hidden><p>Selecione somente o conteúdo móvel. Use o modo assistido ou autorize uma janela para rolar automaticamente a partir da posição atual.</p><div class="scroll-settings"><label>Eixo <select id="scroll-axis"><option value="vertical">Vertical</option><option value="horizontal">Horizontal</option></select></label><fieldset><legend>Excluir áreas fixas (pixels)</legend><label>Topo <input id="crop-top" type="number" min="0" value="0"></label><label>Rodapé <input id="crop-bottom" type="number" min="0" value="0"></label><label>Esquerda <input id="crop-left" type="number" min="0" value="0"></label><label>Direita <input id="crop-right" type="number" min="0" value="0"></label></fieldset><button id="scroll-configure" type="button">Aplicar área e eixo</button></div>
<div class="scroll-automation"><button id="scroll-targets" type="button">Escolher janela atual</button><select id="scroll-target" aria-label="Janela autorizada"><option value="">Escolha uma janela</option></select><label>Limite de passos <input id="scroll-limit" type="number" min="1" max="120" value="60"></label><button id="scroll-auto" type="button">Autorizar e iniciar automático</button><button id="scroll-pause" type="button">Parar agora · preservar</button><button id="scroll-assist" type="button">Continuar assistido</button><small>Ctrl+Shift+Esc interrompe. Trocar de janela interrompe a roda.</small><p id="scroll-progress" role="status"></p></div>
<div class="scroll-row"><button type="button" id="next"><span data-icon="camera"></span>Fotografar trecho</button><label>Sobreposição <input id="overlap" type="number" min="0" placeholder="Auto" aria-label="Sobreposição em pixels"> px</label></div><small>Atalho: Ctrl+Shift+PageDown · <span id="count">1 trecho</span></small><div class="scroll-review"><button id="scroll-preview" type="button">Revisar imagem e emendas</button><button id="scroll-undo" type="button" disabled>Desfazer alteração</button><p id="scroll-budget"></p><p id="scroll-warning" role="status"></p><div id="scroll-seams"></div><figure id="scroll-figure" hidden><div id="scroll-preview-surface"><img id="scroll-image" alt="Prévia integral da imagem unida"><div id="scroll-markers" aria-hidden="true"></div></div><figcaption>Prévia reduzida. Confira cada emenda antes de salvar.</figcaption></figure></div></section><section id="sound" hidden aria-label="Som da gravação"><div class="sound-source"><label class="sound-toggle"><input id="mic-enabled" type="checkbox"> Microfone</label><select id="mic-device" aria-label="Microfone"><option value="">Padrão do Windows</option></select><div class="sound-mix"><input id="mic-volume" type="range" min="0" max="200" step="5" aria-label="Volume do microfone"><button id="mic-mute" type="button" aria-pressed="false">Mudo</button><meter id="mic-level" min="-60" max="0" low="-45" high="-6" optimum="-18" value="-60" aria-label="Nível do microfone"></meter></div><small id="mic-status" role="status"></small></div><div class="sound-source"><label class="sound-toggle"><input id="system-enabled" type="checkbox"> Áudio do PC</label><div class="sound-mix"><input id="system-volume" type="range" min="0" max="200" step="5" aria-label="Volume do áudio do PC"><button id="system-mute" type="button" aria-pressed="false">Mudo</button><meter id="system-level" min="-60" max="0" low="-45" high="-6" optimum="-18" value="-60" aria-label="Nível do áudio do PC"></meter></div><small id="system-status" role="status"></small></div><div id="start-row"><label>Contagem <select id="countdown"><option value="0">Sem contagem</option><option value="3">3 s</option><option value="5">5 s</option><option value="10">10 s</option></select></label><strong id="countdown-status" role="status"></strong><button id="start-now" type="button" class="primary">Gravar agora</button><button id="cancel-start" type="button">Cancelar</button></div></section><p id="capture-feedback" role="status" hidden></p><footer><button type="button" id="finish" class="primary"><span data-icon="stop"></span><span id="finish-text">Parar e salvar</span></button><button type="button" id="pause" hidden aria-pressed="false">Pausar</button><span id="stop-hint">Ctrl+Shift+F10</span><button type="button" id="cancel" hidden>Pausar · preservar</button></footer><p id="error" role="alert" hidden></p><script type="module" src="control.js"></script></body></html>
