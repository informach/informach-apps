<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'"><title>Selecionar região — EdiCaptura</title><link rel="stylesheet" href="../shared/base.css"><link rel="stylesheet" href="selection.css"></head><body>
<img id="desktop" alt="Monitor a capturar" draggable="false"><div id="surface"><div id="region" hidden><i data-handle="nw"></i><i data-handle="n"></i><i data-handle="ne"></i><i data-handle="e"></i><i data-handle="se"></i><i data-handle="s"></i><i data-handle="sw"></i><i data-handle="w"></i></div></div>
<div id="intro"><span data-icon="scan"></span><strong>Selecione a área que deseja capturar</strong><span>Arraste na tela · Esc para cancelar</span></div>
<div id="capture-toolbar" hidden role="toolbar" aria-label="Ações da captura"><button type="button" class="capture-action" data-mode="image" title="Capturar imagem (Enter)" aria-label="Capturar imagem"><span data-icon="camera"></span></button><button type="button" class="capture-action" data-mode="video" title="Gravar vídeo da região" aria-label="Gravar vídeo"><span data-icon="video"></span></button><button type="button" class="capture-action" data-mode="scroll" title="Captura com rolagem assistida" aria-label="Capturar com rolagem"><span data-icon="scroll"></span></button><div class="dimensions"><input id="width" type="number" min="2" aria-label="Largura em pixels"><span>×</span><input id="height" type="number" min="2" aria-label="Altura em pixels"><small>px</small></div><button type="button" id="reset" title="Refazer seleção" aria-label="Refazer seleção"><span data-icon="refresh"></span></button><button type="button" id="cancel" title="Cancelar (Esc)" aria-label="Cancelar captura"><span data-icon="close"></span></button></div>
<div id="selection-tip" hidden>Arraste as bordas para ajustar · Enter para capturar · Esc para cancelar</div><div id="error" role="alert" hidden></div>
<script type="module" src="selection.js"></script></body></html>
