# Railway service config for Missão Saber. The service root stays at the
# monorepo root because every @informach package is consumed as TypeScript source.

[build]
builder = "RAILPACK"
watchPatterns = [
  "/apps/missao-saber/**",
  "/packages/auth/**",
  "/packages/billing/**",
  "/packages/config/**",
  "/packages/db/**",
  "/packages/emails/**",
  "/packages/ui/**",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/turbo.json"
]
buildCommand = "pnpm install --frozen-lockfile --prod=false && pnpm build:missao-saber"

[deploy]
startCommand = "pnpm start:missao-saber"
healthcheckPath = "/api/ready"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
