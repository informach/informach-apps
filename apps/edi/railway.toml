# Keep the service root at /: the portal consumes workspace packages as source.
[build]
builder = "RAILPACK"
watchPatterns = [
  "/apps/edi/**",
  "/packages/auth/**",
  "/packages/billing/**",
  "/packages/config/**",
  "/packages/db/**",
  "/packages/edi-contracts/**",
  "/packages/edi-licensing/**",
  "/packages/edi-releases/**",
  "/packages/emails/**",
  "/packages/ui/**",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/turbo.json",
  "/tsconfig.base.json"
]
buildCommand = "pnpm install --frozen-lockfile --prod=false && pnpm build:edi"

[deploy]
# Schema changes belong to the shared migrator, not to each app deployment.
# This idempotently provisions only the public Edi OAuth client, then closes its owned pool.
preDeployCommand = ["node apps/edi/.next/standalone/apps/edi/setup-oauth.cjs"]
startCommand = "HOSTNAME=0.0.0.0 node apps/edi/.next/standalone/apps/edi/server.js"
healthcheckPath = "/api/ready"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
