# Railway service config para o app cozya (config-as-code).
# Wired no Dashboard via Settings → Service → Config-as-code → "apps/cozya/railway.toml".
# Root Directory do service = "/" (raiz do monorepo) — pnpm workspace precisa
# do repo inteiro pra resolver os pacotes @informach/* via TypeScript source.

[build]
builder = "NIXPACKS"
watchPatterns = [
  "/apps/cozya/**",
  "/packages/ai-core/**",
  "/packages/auth/**",
  "/packages/billing/**",
  "/packages/config/**",
  "/packages/db/**",
  "/packages/emails/**",
  "/packages/ui/**",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/turbo.json"
]
# `--prod=false` força a instalação de devDependencies mesmo com NODE_ENV=production
# no env do service. Sem isso, o pnpm pula `turbo` (devDep) e o build quebra com
# "turbo: not found". `next build` em si continua produzindo bundle de produção
# porque o próprio Next seta NODE_ENV=production durante o build.
buildCommand = "pnpm install --frozen-lockfile --prod=false && pnpm build:cozya && cp -R apps/cozya/public apps/cozya/.next/standalone/apps/cozya/public && cp -R apps/cozya/.next/static apps/cozya/.next/standalone/apps/cozya/.next/static"

[deploy]
startCommand = "HOSTNAME=0.0.0.0 node apps/cozya/.next/standalone/apps/cozya/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
