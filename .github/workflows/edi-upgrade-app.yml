name: Edi Windows installer upgrade for one app
on:
  workflow_call:
    inputs:
      source_ref:
        required: false
        type: string
      app:
        required: true
        type: string
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read native-media capability from the suite catalog
        id: native-media
        shell: pwsh
        run: node --input-type=module -e 'import { hasNativeMedia } from "./packages/config/src/edi-tools.ts"; console.log("enabled=" + hasNativeMedia(process.argv[1]));' '${{ inputs.app }}' >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        if: steps.native-media.outputs.enabled == 'true'
        with:
          name: edi-native-media-windows-x64
          path: .cache/edi-native-media/windows-x64
      - name: Install and upgrade two independently signed Windows versions
        run: pnpm edi:test:upgrade $env:EDI_UPGRADE_APP
        env:
          EDI_UPGRADE_APP: ${{ inputs.app }}
      - name: Preserve upgrade verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: edi-upgrade-${{ inputs.app }}-${{ github.run_attempt }}
          path: .cache/edi-upgrade-results/*.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
