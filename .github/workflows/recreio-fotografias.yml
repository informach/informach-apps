name: Recreio - executor de fotografias

on:
  workflow_dispatch:
    inputs:
      expected_bucket:
        description: Bucket exclusivo autorizado; vazio qualifica apenas imagem off e admissão SQL
        type: string
        default: ""
  push:
    branches: [main, "verify/object-migration-*"]
    paths:
      - ".github/workflows/recreio-fotografias.yml"
      - "infrastructure/railway/recreio-fotografias.Dockerfile"
      - "apps/recreio/scripts/migrar-fotografias.ts"
      - "apps/recreio/scripts/conferir-fronteira-fotografias.mjs"
      - "apps/recreio/src/features/objetos/**"
      - "apps/recreio/src/lib/object-*.ts"

permissions:
  contents: read

concurrency:
  group: recreio-fotografias-${{ github.ref }}
  cancel-in-progress: false

jobs:
  registrar:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo 'Candidata registrada; executar workflow_dispatch para qualificar a imagem.'
  imagem:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Construir imagem exata sem credenciais de provedores
        run: docker build --file infrastructure/railway/recreio-fotografias.Dockerfile --tag recreio-fotografias:qualification .
      - name: Provar off e recusa antes de carregar recursos
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 --memory 256m --cpus 1 --env RECREIO_OBJECTS_KEYS=invalid-private-value --env DATABASE_URL=invalid-private-value recreio-fotografias:qualification > "$RUNNER_TEMP/off.json"
          node -e 'const fs=require("node:fs"),assert=require("node:assert/strict");assert.deepEqual(JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/off.json","utf8")),{formato:"recreio-migracao-fotografias-v1",modo:"off"})'
          if docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 --memory 256m --cpus 1 --env RECREIO_OBJECTS_MIGRATION_MODE=process --env RECREIO_OBJECTS_KEYS=invalid-private-value --env DATABASE_URL=invalid-private-value recreio-fotografias:qualification > "$RUNNER_TEMP/refused.out" 2> "$RUNNER_TEMP/refused.json"; then
            exit 1
          fi
          test ! -s "$RUNNER_TEMP/refused.out"
          node -e 'const fs=require("node:fs"),assert=require("node:assert/strict");assert.deepEqual(JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/refused.json","utf8")),{formato:"recreio-migracao-fotografias-v1",erro:"MIGRACAO_FOTOGRAFIAS_FALHOU"})'
      - name: Preservar bundle exato e integridade sem publicar serviço
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/worker"
          container=$(docker create recreio-fotografias:qualification)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/opt/recreio/migrar-fotografias.cjs" "$RUNNER_TEMP/worker/migrar-fotografias.cjs"
          cd "$RUNNER_TEMP/worker"
          sha256sum migrar-fotografias.cjs > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: recreio-fotografias-${{ github.run_id }}
          path: ${{ runner.temp }}/worker/
          retention-days: 14

  sql:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provar admissão da fila em PostgreSQL descartável, sem credenciais externas
        run: pnpm --filter @informach/recreio-app test:object-migration
      - name: Construir a imagem exata para processamento nativo sintético
        if: inputs.expected_bucket != ''
        run: docker build --file infrastructure/railway/recreio-fotografias.Dockerfile --tag recreio-fotografias:qualification .
      - name: Provar processamento real no único bucket de homologação autorizado
        if: inputs.expected_bucket != ''
        env:
          RECREIO_OBJECTS_MIGRATION_OPERATIONAL_PROBE: "1"
          RECREIO_S3_EXPECTED_BUCKET: ${{ inputs.expected_bucket }}
          RECREIO_S3_TEST_BUCKET: ${{ secrets.RECREIO_S3_TEST_BUCKET }}
          RECREIO_S3_TEST_ENDPOINT: ${{ secrets.RECREIO_S3_TEST_ENDPOINT }}
          RECREIO_S3_TEST_REGION: ${{ secrets.RECREIO_S3_TEST_REGION }}
          RECREIO_S3_TEST_PATH_STYLE: ${{ secrets.RECREIO_S3_TEST_PATH_STYLE }}
          RECREIO_S3_TEST_ACCESS_KEY: ${{ secrets.RECREIO_S3_TEST_ACCESS_KEY }}
          RECREIO_S3_TEST_SECRET_KEY: ${{ secrets.RECREIO_S3_TEST_SECRET_KEY }}
        run: |
          test "$RECREIO_S3_EXPECTED_BUCKET" = "recreio-homologacao-c0xyqx"
          test "$RECREIO_S3_TEST_BUCKET" = "$RECREIO_S3_EXPECTED_BUCKET"
          pnpm --filter @informach/recreio-app test:object-migration-operational
      - uses: actions/upload-artifact@v4
        if: always() && inputs.expected_bucket != ''
        with:
          name: recreio-fotografias-operacional-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recreio-fotografias-operacional.json
          retention-days: 14
