name: Recreio - objetos privados

on:
  workflow_dispatch:
    inputs:
      provider_probe:
        description: Provar somente bucket dedicado de homologacao com bytes sinteticos
        type: boolean
        default: false
      native_probe:
        description: Provar executor nativo com Postgres descartavel e bucket de homologacao
        type: boolean
        default: false
      file_probe:
        description: Provar arquivo cifrado sintetico sem banco no bucket de homologacao
        type: boolean
        default: false
      expected_bucket:
        description: Nome S3 exato do bucket recreio-homologacao provisionado
        type: string
        default: ""
  push:
    branches: ["verify/object-probe-*"]

permissions:
  contents: read

concurrency:
  group: recreio-objetos-${{ github.ref }}-${{ inputs.file_probe && 'file' || inputs.native_probe && 'native' || inputs.provider_probe && 'provider' || 'qualification' }}
  # Uma prova externa deve terminar sua limpeza, inclusive quando chega outro push.
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      DATABASE_URL: postgres://ci:ci@127.0.0.1:9/metadata_only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @informach/recreio-app typecheck
      - run: pnpm --filter @informach/recreio-app test -- src/features/objetos
  provider:
    needs: qualify
    if: github.event_name == 'workflow_dispatch' && inputs.provider_probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      RECREIO_S3_EXPECTED_BUCKET: ${{ inputs.expected_bucket }}
      RECREIO_S3_TEST_BUCKET: ${{ secrets.RECREIO_S3_TEST_BUCKET }}
      RECREIO_S3_TEST_ENDPOINT: ${{ secrets.RECREIO_S3_TEST_ENDPOINT }}
      RECREIO_S3_TEST_REGION: ${{ secrets.RECREIO_S3_TEST_REGION }}
      RECREIO_S3_TEST_PATH_STYLE: ${{ secrets.RECREIO_S3_TEST_PATH_STYLE }}
      RECREIO_S3_TEST_ACCESS_KEY: ${{ secrets.RECREIO_S3_TEST_ACCESS_KEY }}
      RECREIO_S3_TEST_SECRET_KEY: ${{ secrets.RECREIO_S3_TEST_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provar condicao, integridade, acesso privado e limpeza do objeto proprio
        run: pnpm --filter @informach/recreio-app exec node --conditions=react-server --import tsx scripts/objetos-prova.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recreio-objetos-provider-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recreio-objetos-provider.json
          if-no-files-found: warn
          retention-days: 7
  file-provider:
    needs: qualify
    if: github.event_name == 'workflow_dispatch' && inputs.file_probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      RECREIO_S3_EXPECTED_BUCKET: ${{ inputs.expected_bucket }}
      RECREIO_S3_TEST_BUCKET: ${{ secrets.RECREIO_S3_TEST_BUCKET }}
      RECREIO_S3_TEST_ENDPOINT: ${{ secrets.RECREIO_S3_TEST_ENDPOINT }}
      RECREIO_S3_TEST_REGION: ${{ secrets.RECREIO_S3_TEST_REGION }}
      RECREIO_S3_TEST_PATH_STYLE: ${{ secrets.RECREIO_S3_TEST_PATH_STYLE }}
      RECREIO_S3_TEST_ACCESS_KEY: ${{ secrets.RECREIO_S3_TEST_ACCESS_KEY }}
      RECREIO_S3_TEST_SECRET_KEY: ${{ secrets.RECREIO_S3_TEST_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provar arquivo, replay, recuperacao e limpeza sem dados reais
        run: pnpm --filter @informach/recreio-app exec node --import tsx scripts/backup/provar-arquivo-s3.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recreio-arquivo-provider-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recreio-arquivo-provider.json
          if-no-files-found: warn
          retention-days: 7
  native-provider:
    needs: qualify
    if: github.event_name == 'workflow_dispatch' && inputs.native_probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: recreio_object_probe
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci -d recreio_object_probe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/recreio_object_probe
      BETTER_AUTH_SECRET: ci-native-object-probe-not-a-real-secret-xxxxxxxx
      BETTER_AUTH_URL: http://127.0.0.1:3009
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3009
      SENDGRID_API_KEY: SG.not_sent
      SENDGRID_FROM: ci@example.test
      EMAIL_SANDBOX_MODE: memory
      RECREIO_ISOLATED_TEST: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      RECREIO_S3_EXPECTED_BUCKET: ${{ inputs.expected_bucket }}
      RECREIO_S3_TEST_BUCKET: ${{ secrets.RECREIO_S3_TEST_BUCKET }}
      RECREIO_S3_TEST_ENDPOINT: ${{ secrets.RECREIO_S3_TEST_ENDPOINT }}
      RECREIO_S3_TEST_REGION: ${{ secrets.RECREIO_S3_TEST_REGION }}
      RECREIO_S3_TEST_PATH_STYLE: ${{ secrets.RECREIO_S3_TEST_PATH_STYLE }}
      RECREIO_S3_TEST_ACCESS_KEY: ${{ secrets.RECREIO_S3_TEST_ACCESS_KEY }}
      RECREIO_S3_TEST_SECRET_KEY: ${{ secrets.RECREIO_S3_TEST_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Aplicar somente migrations no Postgres descartavel, sem seeds
        run: pnpm --filter @informach/db db:migrate
      - name: Provar tentativa, recuperacao, leitura nativa e limpeza sem dados reais
        run: pnpm --filter @informach/recreio-app exec node --conditions=react-server --import tsx scripts/objetos-nativos-prova.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recreio-objetos-nativos-provider-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recreio-objetos-nativos-provider.json
          if-no-files-found: warn
          retention-days: 7
