name: Edi native media with corresponding source
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore media bundle for these exact build inputs
        id: media-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .cache/edi-native-media/windows-x64
          key: edi-media-windows-x64-node24.15.0-v1-${{ hashFiles('scripts/edi/media/**', 'scripts/edi/build-media.mts', 'scripts/edi/media-bundle.mts', 'pnpm-lock.yaml') }}
      - name: Cross-compile the pinned sources and preserve complete build inputs
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: pnpm edi:media:build
      - name: Verify recipe, corresponding source and every cached or built byte
        run: node --input-type=module -e 'import { verifyNativeMediaBundle } from "./scripts/edi/media-bundle.mts"; await verifyNativeMediaBundle();'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: edi-native-media-windows-x64
          path: .cache/edi-native-media/windows-x64
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  verify:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: edi-native-media-windows-x64
          path: .cache/edi-native-media/windows-x64
      - name: Check sound-test eligibility without audio acquisition
        id: sound
        shell: pwsh
        run: ./scripts/edi/test-sound-preflight.ps1 -OutputPath .cache/edi-sound-test-eligibility.json
      - name: Verify native capabilities and catalog consumer regressions against these binaries
        run: pnpm edi:media:test
        # Explicit on this disposable runner; sound also needs an active default output.
        # A runner without one still runs the synthetic/media tests and counts sound skips.
        env:
          EDIAULA_NATIVE_INPUT_TESTS: "1"
          EDIAULA_SOUND_TESTS: ${{ steps.sound.outputs.sound_tests }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: edi-native-media-verification
          path: |
            .cache/edi-media-verification.json
            .cache/edi-sound-test-eligibility.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
