name: Morada - falhas e reconexao

on:
  workflow_dispatch:
  push:
    branches: ["verify/morada-operacao-*"]

permissions:
  contents: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Conferir tipos do servidor
        run: pnpm --filter @informach/morada-server typecheck
      - name: Conferir resumo privado e fila real de reconexao
        run: pnpm --filter @informach/morada-server exec vitest run src/resumo-da-falha.test.ts src/observabilidade.test.ts test/reconexao-enfileirada.test.ts --reporter=default --reporter=json --outputFile=${{ runner.temp }}/morada-operacao.json
      - name: Preservar resultado sintetico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morada-operacao-${{ github.run_attempt }}
          path: ${{ runner.temp }}/morada-operacao.json
          if-no-files-found: warn
          retention-days: 30
