name: Recreio - encerramento nativo isolado

on:
  workflow_call:
    inputs:
      expected_bucket:
        type: string
        required: true
    secrets:
      RECREIO_S3_TEST_BUCKET:
        required: true
      RECREIO_S3_TEST_ENDPOINT:
        required: true
      RECREIO_S3_TEST_REGION:
        required: true
      RECREIO_S3_TEST_PATH_STYLE:
        required: true
      RECREIO_S3_TEST_ACCESS_KEY:
        required: true
      RECREIO_S3_TEST_SECRET_KEY:
        required: true
  workflow_dispatch:
    inputs:
      expected_bucket:
        description: Bucket exclusivo de homologacao ja autorizado
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: recreio-encerramento-${{ github.ref }}
  cancel-in-progress: false

jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      NEXT_TELEMETRY_DISABLED: "1"
      RECREIO_S3_EXPECTED_BUCKET: ${{ inputs.expected_bucket }}
      RECREIO_S3_TEST_BUCKET: ${{ secrets.RECREIO_S3_TEST_BUCKET }}
      RECREIO_S3_TEST_ENDPOINT: ${{ secrets.RECREIO_S3_TEST_ENDPOINT }}
      RECREIO_S3_TEST_REGION: ${{ secrets.RECREIO_S3_TEST_REGION }}
      RECREIO_S3_TEST_PATH_STYLE: ${{ secrets.RECREIO_S3_TEST_PATH_STYLE }}
      RECREIO_S3_TEST_ACCESS_KEY: ${{ secrets.RECREIO_S3_TEST_ACCESS_KEY }}
      RECREIO_S3_TEST_SECRET_KEY: ${{ secrets.RECREIO_S3_TEST_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: echo '127.0.0.1 api.stripe.com' | sudo tee -a /etc/hosts
      - run: pnpm --filter @informach/recreio-app exec playwright install --with-deps chromium
      - name: Consentir e executar somente contas sinteticas
        run: pnpm --filter @informach/recreio-app e2e:account-closure
      - name: Retomar limpeza dos objetos proprios mesmo em falha
        if: always()
        run: pnpm --filter @informach/recreio-app exec node --conditions=react-server --import tsx scripts/encerramento-prova.ts cleanup
      - name: Conferir recibo completo
        run: jq -e '.status == "passed" and .browserJourneyVerified == true and .technicalRetentionUiVerified == true and .fullPrefixVerified == true and .cleanupConfirmed == true and .productionDataTouched == false and .realFinancialCredentialsPresent == false' "$RUNNER_TEMP/recreio-encerramento-prova.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recreio-encerramento-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/recreio-encerramento-prova.json
            apps/recreio/tmp/telas/encerramento-aceites-390.png
            apps/recreio/tmp/telas/encerramento-processando-390.png
            apps/recreio/tmp/telas/encerramento-concluido-390.png
            apps/recreio/tmp/telas/encerramento-sem-jogador-390.png
            apps/recreio/tmp/telas/encerramento-retencao-390.png
          if-no-files-found: warn
          retention-days: 7
