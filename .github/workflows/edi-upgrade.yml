name: Edi Windows installer upgrades
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        required: false
        type: string
  pull_request:
    branches: [main]
    paths:
      - "apps/edi*/**"
      - "packages/edi-*/**"
      - "packages/config/src/edi-tools.ts"
      - "scripts/edi/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/edi-media.yml"
      - ".github/workflows/edi-upgrade.yml"
permissions:
  contents: read
jobs:
  media:
    uses: ./.github/workflows/edi-media.yml
    with:
      source_ref: ${{ inputs.source_ref || github.sha }}
  catalog:
    runs-on: ubuntu-24.04
    outputs:
      applications: ${{ steps.catalog.outputs.applications }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
      - name: Discover applications from the suite catalog
        id: catalog
        run: node --input-type=module -e 'import { EDI_DESKTOP_APPS } from "./packages/config/src/edi-tools.ts"; console.log("applications=" + JSON.stringify(EDI_DESKTOP_APPS.map(app => app.id)))' >> "$GITHUB_OUTPUT"
  upgrade:
    needs: [catalog, media]
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        app: ${{ fromJSON(needs.catalog.outputs.applications) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: matrix.app == 'ediaula'
        with:
          name: edi-native-media-windows-x64
          path: .cache/edi-native-media/windows-x64
      - name: Install and upgrade two independently signed Windows versions
        run: pnpm edi:test:upgrade ${{ matrix.app }}
      - name: Preserve upgrade verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: edi-upgrade-${{ matrix.app }}-${{ github.run_attempt }}
          path: .cache/edi-upgrade-results/*.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
