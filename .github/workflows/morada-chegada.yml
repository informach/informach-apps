name: Morada - chegada da familia

on:
  workflow_dispatch:
  push:
    branches: ["verify/morada-chegada-*"]

permissions:
  contents: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Conferir os tipos do nucleo e dos testes
        run: pnpm --filter @informach/morada-sim typecheck
      - name: Exercitar geometria fundacao e restauracao
        run: pnpm --filter @informach/morada-sim exec vitest run src/espaco/chegada.test.ts testes/fundacao.test.ts --reporter=default --reporter=json --outputFile=${{ runner.temp }}/morada-chegada.json
      - name: Preservar resultado sintetico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morada-chegada-${{ github.run_attempt }}
          path: ${{ runner.temp }}/morada-chegada.json
          if-no-files-found: warn
          retention-days: 30
