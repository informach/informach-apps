name: Recreio - arquivo cifrado com memoria limitada

on:
  workflow_dispatch:
  push:
    branches: ["verify/backup-file-*"]

permissions:
  contents: read

concurrency:
  group: recreio-backup-arquivo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perfil:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Construir executor com as versoes nativas fixadas
        run: docker build -f infrastructure/railway/recreio-backup-arquivo.Dockerfile -t recreio-backup-arquivo:ci .
      - name: Provar arquivo de 384 MiB em container de 256 MiB sem rede
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recreio-backup-arquivo"
          docker run --rm --network none --memory 256m --memory-swap 256m --cpus 2 --pids-limit 128 \
            --env CI=true --env GITHUB_ACTIONS=true --env GITHUB_REPOSITORY \
            --env GITHUB_RUN_ID --env GITHUB_SHA --env RECREIO_FILE_RECEIPT_DIR=/evidence \
            --mount "type=bind,source=$RUNNER_TEMP/recreio-backup-arquivo,target=/evidence" \
            recreio-backup-arquivo:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recreio-backup-arquivo-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recreio-backup-arquivo/recreio-backup-arquivo.json
          if-no-files-found: warn
          retention-days: 7
