name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-build-placeholder-not-a-real-secret-xxxx
      BETTER_AUTH_URL: http://localhost:3000
      SENDGRID_API_KEY: SG.ci.build-placeholder
      SENDGRID_FROM: ci@example.com
      EMAIL_SANDBOX_MODE: sandbox
      CRON_SECRET: ci-build-placeholder-not-a-real-secret-xxxx
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      STRIPE_SECRET_KEY: sk_test_ci_build_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_build_placeholder
      STRIPE_MODE: dev
      OPENROUTER_API_KEY: sk-or-ci-build-placeholder
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm typecheck

      - run: pnpm test

      - run: node --test scripts/compasso/postgres-fixture.test.mjs

      - run: node --test scripts/compasso/redis-fixture.test.mjs

      - run: pnpm compasso:test:integration

      - run: pnpm db:migrate

      - run: pnpm --filter @informach/agenda-da-turma test:integration

      - run: pnpm --filter @informach/cozya test:integration

      - run: pnpm --filter @informach/missao-saber test:integration

      - run: pnpm --filter @informach/bora-treinar test:integration

      - run: pnpm --filter @informach/dia-de-estrela test:integration

      - run: pnpm --filter @informach/recreio-app test:integration

      - run: pnpm --filter @informach/cozya eval
        env:
          EVAL_PREFLIGHT: "1"

      - run: pnpm --filter @informach/agenda-da-turma exec playwright install --with-deps chromium

      - run: pnpm --filter @informach/edisvg exec playwright install --with-deps chromium

      - run: pnpm --filter @informach/edisvg build

      - run: pnpm --filter @informach/edisvg test:e2e

      - run: pnpm --filter @informach/edisvg test:next

      - run: pnpm --filter @informach/edifoto exec playwright install --with-deps chromium

      - run: pnpm --filter @informach/edifoto test:e2e

      - run: pnpm --filter @informach/cozya e2e

      - run: pnpm --filter @informach/agenda-da-turma e2e

      - run: pnpm --filter @informach/missao-saber e2e

      - run: pnpm --filter @informach/bora-treinar e2e

      - run: pnpm --filter @informach/dia-de-estrela e2e

      # Portal em build de produção, banco descartável e, como processos à
      # parte, o servidor do jogo de teste e o servidor do Morada de verdade
      # (`apps/morada-server`). Não usa segredo nem serviço de fora: os segredos
      # da execução são gerados na hora. O Morada desenha em WebGL por software.
      - run: pnpm --filter @informach/recreio-app e2e

      # O build do Recreio valida o ambiente como produção e exige a chave dos
      # tokens. Ela é gerada aqui, vale só para este build e não fica em arquivo.
      - name: Chave descartável dos tokens do Recreio
        run: node apps/recreio/scripts/gerar-chave.mjs --github-env >> "$GITHUB_ENV"

      # Cada consumidor SSO precisa incorporar sua própria origem do catálogo.
      - run: pnpm exec tsx scripts/compasso/build-ci.mts
        env:
          BETTER_AUTH_URL: https://ci.example.com
          NEXT_PUBLIC_APP_URL: https://ci.example.com
          EMAIL_SANDBOX_MODE: live
          SENDGRID_WEBHOOK_PUBLIC_KEY: ci-build-placeholder
          STRIPE_SECRET_KEY: sk_live_ci_build_placeholder
          STRIPE_MODE: prod
          STRIPE_PORTAL_CONFIGURATION_ID: bpc_ci_build_placeholder
          MISSAO_INDIVIDUAL_MONTHLY_PRICE: price_ci_individual_monthly
          MISSAO_INDIVIDUAL_ANNUAL_PRICE: price_ci_individual_annual
          MISSAO_FAMILY_MONTHLY_PRICE: price_ci_family_monthly
          MISSAO_FAMILY_ANNUAL_PRICE: price_ci_family_annual
          BORA_INDIVIDUAL_MONTHLY_PRICE: price_ci_bora_individual_monthly
          BORA_INDIVIDUAL_ANNUAL_PRICE: price_ci_bora_individual_annual
          BORA_FAMILY_MONTHLY_PRICE: price_ci_bora_family_monthly
          BORA_FAMILY_ANNUAL_PRICE: price_ci_bora_family_annual
          VAPID_PUBLIC_KEY: ci-build-placeholder-vapid-public
          VAPID_PRIVATE_KEY: ci-build-placeholder-vapid-private
          SENTRY_DSN: https://public@ci.example.com/1
          NEXT_PUBLIC_SENTRY_DSN: https://public@ci.example.com/1
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - run: pnpm build:conta
        env:
          NEXT_PUBLIC_APP_URL: https://conta.informach.com.br
          COMPASSO_TRIAL_HASH_SECRET: ci-build-placeholder-not-a-real-secret-yyyy
          COMPASSO_BILLING_ENABLED: "true"
          COMPASSO_MONTHLY_PRICE: price_ci_compasso_monthly
          COMPASSO_ANNUAL_PRICE: price_ci_compasso_annual
          COMPASSO_CREDITS_100_PRICE: price_ci_compasso_credits_100
          COMPASSO_CREDITS_300_PRICE: price_ci_compasso_credits_300
          COMPASSO_CREDITS_1000_PRICE: price_ci_compasso_credits_1000
          EMAIL_SANDBOX_MODE: live
          STRIPE_SECRET_KEY: sk_live_ci_build_placeholder
          STRIPE_MODE: prod
          STRIPE_PORTAL_CONFIGURATION_ID: bpc_ci_build_placeholder

      - name: Preserve Missao Saber failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: missao-saber-verification-${{ github.run_attempt }}
          path: apps/conta/test-results/compasso-apps/missao-saber/
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve Bora Treinar failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bora-treinar-verification-${{ github.run_attempt }}
          path: apps/conta/test-results/compasso-apps/bora-treinar/
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve Dia de Estrela failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dia-de-estrela-verification-${{ github.run_attempt }}
          path: apps/conta/test-results/compasso-apps/dia-de-estrela/
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve Recreio failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recreio-verification-${{ github.run_attempt }}
          path: apps/recreio/tmp/verification/
          if-no-files-found: ignore
          retention-days: 7

      # Agenda e Cozya gravam o trace no retry (`trace: on-first-retry`). Sem
      # este upload ele morria com o runner, e uma falha intermitente só deixava
      # a mensagem do expect para investigar.
      - name: Preserve Agenda and Cozya failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ github.run_attempt }}
          path: |
            apps/agenda-da-turma/test-results/
            apps/cozya/test-results/
            apps/conta/test-results/compasso-apps/cozya/
            apps/conta/test-results/compasso-apps/agenda-da-turma/
          if-no-files-found: ignore
          retention-days: 7
