name: Diagnóstico isolado EdiFoto
on:
  push:
    branches: [proof/recreio-guarda-edifoto-20261117]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [completa, fidelity]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @informach/edifoto exec playwright install --with-deps chromium
      - if: matrix.suite == 'completa'
        run: pnpm --filter @informach/edifoto test:e2e
      - if: matrix.suite == 'fidelity'
        run: pnpm --filter @informach/edifoto test:e2e fidelity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostico-edifoto-${{ matrix.suite }}
          path: .cache/edifoto-tests
