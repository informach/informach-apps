name: CI

# DIAGNÓSTICO TEMPORÁRIO (branch diag/chromium-sw-dispose): não vai para a main.
# Mede se descartar um contexto com o service worker instalando derruba o
# Chromium headless no Linux.

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-build-placeholder-not-a-real-secret-xxxx
      BETTER_AUTH_URL: http://localhost:3000
      SENDGRID_API_KEY: SG.ci.build-placeholder
      SENDGRID_FROM: ci@example.com
      EMAIL_SANDBOX_MODE: sandbox
      CRON_SECRET: ci-build-placeholder-not-a-real-secret-xxxx
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      STRIPE_SECRET_KEY: sk_test_ci_build_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_build_placeholder
      STRIPE_MODE: dev
      OPENROUTER_API_KEY: sk-or-ci-build-placeholder
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate

      - run: pnpm --filter @informach/agenda-da-turma exec playwright install --with-deps chromium

      - name: Stress context disposal
        run: pnpm --filter @informach/missao-saber e2e e2e/zz-stress-context.spec.ts --project=desktop
        env:
          DEBUG: pw:browser

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ github.run_attempt }}
          path: apps/missao-saber/tmp/verification/
          if-no-files-found: ignore
          retention-days: 3
