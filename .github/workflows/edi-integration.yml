name: Edi database integration
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      source_ref:
        description: Exact source version under verification
        required: false
        type: string
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: edi_check
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: edi_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edi_check -d edi_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://edi_check:disposable-ci-password@127.0.0.1:5432/edi_integration
      EDI_ISOLATED_DATABASE: "1"
      NEXT_PUBLIC_APP_URL: https://edi.example.test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply the complete migration history to the disposable database
        run: pnpm --filter @informach/db db:migrate
      # The Compasso auth suites run in ci.yml with their own disposable fixture;
      # this database is scoped to the Edi desktop contracts.
      - name: Verify desktop OAuth, device transactions and billing concurrency
        run: |
          pnpm --filter @informach/auth exec vitest run --config vitest.integration.config.ts src/desktop-oauth.integration.ts
          pnpm --workspace-concurrency=1 --filter @informach/edi-licensing --filter @informach/edi test:integration
      - name: Build the actual standalone portal and OAuth deployment command
        run: pnpm build:edi
      - name: Verify standalone assets, authentication, OAuth and disabled billing over HTTP
        run: pnpm exec node scripts/edi/test-portal.mts
