name: Recreio - executor restrito de direitos
on:
  workflow_dispatch:
    inputs:
      expected_bucket:
        description: Bucket exclusivo de homologacao ja autorizado
        type: string
        required: true
  push:
    branches: ["verify/rights-worker-*"]
permissions:
  contents: read
concurrency:
  group: recreio-direitos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @informach/recreio-app typecheck
      - run: pnpm --filter @informach/recreio-app test -- src/features/direitos/financeiro-runtime.test.ts src/features/direitos/coordenacao-catalogo.test.ts src/lib/rights-environment.test.ts src/lib/private-storage-context.test.ts src/lib/object-environment.test.ts src/features/direitos/monitoramento.test.ts src/lib/rights-monitor-environment.test.ts
      - name: Construir executor sem login, email ou servidor web
        run: docker build -f infrastructure/railway/recreio-direitos.Dockerfile -t recreio-direitos:qualification .
      - name: Conferir modo desligado sem rede ou credenciais
        shell: bash
        run: |
          output=$(docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges recreio-direitos:qualification)
          EXPECTED_OUTPUT="$output" node -e 'const x=JSON.parse(process.env.EXPECTED_OUTPUT); if(x.formato!=="recreio-direitos-rodada-v1" || x.modo!=="off" || Object.keys(x).length!==2) process.exit(1)'
          test "$(docker inspect --format '{{.Config.User}}' recreio-direitos:qualification)" = node
      - name: Recusar modo ativo incompleto e argumentos arbitrarios
        shell: bash
        run: |
          for scenario in config argument; do
            set +e
            if [ "$scenario" = config ]; then
              output=$(docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges -e RECREIO_RIGHTS_MODE=process recreio-direitos:qualification 2>&1)
            else
              output=$(docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges recreio-direitos:qualification unexpected 2>&1)
            fi
            result=$?
            set -e
            test "$result" -eq 1
            EXPECTED_OUTPUT="$output" node -e 'const x=JSON.parse(process.env.EXPECTED_OUTPUT); if(x.formato!=="recreio-direitos-rodada-v1" || x.erro!=="DIREITOS_PROCESSAMENTO_FALHOU" || Object.keys(x).length!==2) process.exit(1)'
          done
      - name: Executar imagem ativa com SQL descartavel e livro externo de homologacao
        if: github.event_name == 'workflow_dispatch'
        env:
          RECREIO_RIGHTS_OPERATIONAL_PROBE: "1"
          RECREIO_RIGHTS_OPERATIONAL_DOCKER_IMAGE: recreio-direitos:qualification
          RECREIO_S3_EXPECTED_BUCKET: ${{ inputs.expected_bucket }}
          RECREIO_S3_TEST_BUCKET: ${{ secrets.RECREIO_S3_TEST_BUCKET }}
          RECREIO_S3_TEST_ENDPOINT: ${{ secrets.RECREIO_S3_TEST_ENDPOINT }}
          RECREIO_S3_TEST_REGION: ${{ secrets.RECREIO_S3_TEST_REGION }}
          RECREIO_S3_TEST_PATH_STYLE: ${{ secrets.RECREIO_S3_TEST_PATH_STYLE }}
          RECREIO_S3_TEST_ACCESS_KEY: ${{ secrets.RECREIO_S3_TEST_ACCESS_KEY }}
          RECREIO_S3_TEST_SECRET_KEY: ${{ secrets.RECREIO_S3_TEST_SECRET_KEY }}
        run: pnpm --filter @informach/recreio-app test:rights-operational
      - name: Guardar bundle e recibo da candidata
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/recreio-direitos"
          id=$(docker create recreio-direitos:qualification)
          trap 'docker rm "$id" >/dev/null' EXIT
          docker cp "$id:/opt/recreio/processar-direitos.cjs" "$RUNNER_TEMP/recreio-direitos/processar-direitos.cjs"
          sha256sum "$RUNNER_TEMP/recreio-direitos/processar-direitos.cjs" > "$RUNNER_TEMP/recreio-direitos/SHA256SUMS"
          ARTIFACT_DIR="$RUNNER_TEMP/recreio-direitos" node --input-type=module -e 'import {readFile,writeFile} from "node:fs/promises";import {createHash} from "node:crypto";const p=process.env.ARTIFACT_DIR;const sha=createHash("sha256").update(await readFile(`${p}/processar-direitos.cjs`)).digest("hex");await writeFile(`${p}/recibo.json`,JSON.stringify({formato:"recreio-direitos-build-v1",source:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,bundleSha256:sha,offWithoutCredentialsVerified:true,incompleteConfigRefused:true,argumentsRefused:true,nativeProcessingProven:false,productionCredentialsUsed:false,productionDataTouched:false})+"\n")'
      - uses: actions/upload-artifact@v4
        with:
          name: recreio-direitos-${{ github.run_id }}
          path: ${{ runner.temp }}/recreio-direitos
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: recreio-direitos-operacional-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recreio-direitos-operacional.json
          if-no-files-found: warn
          retention-days: 30
