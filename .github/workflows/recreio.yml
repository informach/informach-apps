name: Recreio

on:
  workflow_dispatch:
    inputs:
      account_closure_probe:
        description: Provar encerramento nativo isolado com livro exclusivo de homologacao
        type: boolean
        default: false
      account_closure_expected_bucket:
        description: Bucket exclusivo esperado para a prova de encerramento
        type: string
        default: ""
      verification_gate:
        description: Verificação auxiliar; somente all qualifica a rodada completa
        type: choice
        options: [all, quality, integration, rights, rights-ui, catalog-ui, versoes, capacity, backup-capture, commercial-reconciliation, commercial-ui]
        default: all
      capacity_seconds:
        description: Segundos reais por cenario de protocolo (somente no GitHub)
        type: choice
        options: ["60", "120", "180"]
        default: "60"
      sandbox_catalog:
        description: Conferir catálogo real no Stripe Sandbox (sem clientes ou cobranças)
        type: boolean
        default: false
      sandbox_journey:
        description: Homologar Checkout e webhook reais em modo de teste e banco descartável
        type: boolean
        default: false
      sandbox_plans:
        description: Homologar APIs de agenda, renovação, cancelamento e estorno com relógio de teste (sem Checkout nativo)
        type: boolean
        default: false
      sandbox_plans_scenario:
        description: Cenário de API do provedor (sem homologar Checkout nativo)
        type: choice
        options: [monthly_upgrade, annual_credit, plan_matrix]
        default: monthly_upgrade
      sandbox_apply:
        description: Criar somente produtos/preços/portal Sandbox ausentes
        type: boolean
        default: false
      sandbox_native_renewals:
        description: Preparar/conferir portal Sandbox separado com renovação gerida no Recreio
        type: boolean
        default: false
      sandbox_account:
        description: ID da conta Stripe de teste esperada
        type: string
        default: ""
      sandbox_app_url:
        description: Origem da aplicação de homologação
        type: string
        default: "https://recreio.informach.com.br"
  push:
    branches: [main, "verify/recreio-*"]
    paths:
      - ".github/workflows/recreio.yml"
      - ".railway/railway.ts"
      - "apps/recreio/**"
      - "apps/admin/**"
      - "apps/morada-server/**"
      - "packages/recreio/**"
      - "packages/morada-sim/**"
      - "packages/morada-arte/**"
      - "packages/jogo-morada/**"
      - "packages/config/**"
      - "packages/db/**"
      - "packages/auth/**"
      - "packages/billing/**"
      - "packages/emails/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: recreio-${{ github.ref }}-${{ inputs.account_closure_probe && 'account-closure' || inputs.sandbox_plans && 'stripe-plans' || inputs.sandbox_journey && 'stripe-journey' || inputs.sandbox_catalog && 'stripe-catalog' || 'verification' }}-${{ inputs.verification_gate || 'all' }}
  cancel-in-progress: ${{ !inputs.account_closure_probe }}

jobs:
  account-closure-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.account_closure_probe
    uses: ./.github/workflows/recreio-encerramento.yml
    with:
      expected_bucket: ${{ inputs.account_closure_expected_bucket }}
    secrets:
      RECREIO_S3_TEST_BUCKET: ${{ secrets.RECREIO_S3_TEST_BUCKET }}
      RECREIO_S3_TEST_ENDPOINT: ${{ secrets.RECREIO_S3_TEST_ENDPOINT }}
      RECREIO_S3_TEST_REGION: ${{ secrets.RECREIO_S3_TEST_REGION }}
      RECREIO_S3_TEST_PATH_STYLE: ${{ secrets.RECREIO_S3_TEST_PATH_STYLE }}
      RECREIO_S3_TEST_ACCESS_KEY: ${{ secrets.RECREIO_S3_TEST_ACCESS_KEY }}
      RECREIO_S3_TEST_SECRET_KEY: ${{ secrets.RECREIO_S3_TEST_SECRET_KEY }}
  capacity-proof:
    if: github.event_name == 'workflow_dispatch' && !inputs.account_closure_probe && inputs.verification_gate == 'capacity'
    uses: ./.github/workflows/recreio-capacidade.yml
    with:
      seconds: ${{ inputs.capacity_seconds }}
  sandbox-catalog:
    if: github.event_name == 'workflow_dispatch' && !inputs.account_closure_probe && inputs.sandbox_catalog && !inputs.sandbox_journey && !inputs.sandbox_plans
    name: Recreio / catálogo Stripe Sandbox real
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgres://ci:ci@127.0.0.1:9/metadata_only
      STRIPE_SECRET_KEY: ${{ secrets.RECREIO_STRIPE_SANDBOX_SECRET_KEY }}
      STRIPE_EXPECTED_ACCOUNT: ${{ inputs.sandbox_account }}
      RECREIO_SANDBOX_APP_URL: ${{ inputs.sandbox_app_url }}
      RECREIO_SANDBOX_APPLY: ${{ inputs.sandbox_apply }}
      RECREIO_SANDBOX_NATIVE_RENEWALS: ${{ inputs.sandbox_native_renewals }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @informach/recreio-app typecheck
      - run: pnpm --filter @informach/recreio-app exec tsx scripts/sandbox-catalogo.ts
        env:
          RECREIO_SANDBOX_RECEIPT_PATH: ${{ runner.temp }}/recreio-stripe-sandbox.json
      - uses: actions/upload-artifact@v4
        with:
          name: recreio-stripe-sandbox-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recreio-stripe-sandbox.json
          if-no-files-found: error
          retention-days: 7
  sandbox-journey:
    if: github.event_name == 'workflow_dispatch' && !inputs.account_closure_probe && inputs.sandbox_journey && !inputs.sandbox_plans
    name: Recreio / jornada Stripe Sandbox real
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      STRIPE_SECRET_KEY: ${{ secrets.RECREIO_STRIPE_SANDBOX_SECRET_KEY }}
      STRIPE_EXPECTED_ACCOUNT: ${{ inputs.sandbox_account }}
      STRIPE_NO_AUTO_UPDATE: "1"
      STRIPE_CLI_TELEMETRY_OPTOUT: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      STRIPE_CLI_VERSION: "1.55.12"
      STRIPE_CLI_ARCHIVE_SHA256: "89d0bbec0970917a07fbd4d3a98afecf95b08f88f0687362c4a94447a0610245"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @informach/recreio-app typecheck
      - name: Instalar CLI Stripe fixado e conferir SHA-256 oficial
        shell: bash
        run: |
          set -euo pipefail
          stripe_tool_dir="$RUNNER_TEMP/recreio-stripe-cli"
          mkdir -p "$stripe_tool_dir"
          curl --fail --location --silent --show-error "https://github.com/stripe/stripe-cli/releases/download/v${STRIPE_CLI_VERSION}/stripe_${STRIPE_CLI_VERSION}_linux_x86_64.tar.gz" --output "$stripe_tool_dir/stripe.tar.gz"
          echo "$STRIPE_CLI_ARCHIVE_SHA256  $stripe_tool_dir/stripe.tar.gz" | sha256sum --check --status
          tar -xzf "$stripe_tool_dir/stripe.tar.gz" -C "$stripe_tool_dir" stripe
          chmod +x "$stripe_tool_dir/stripe"
          echo "$stripe_tool_dir" >> "$GITHUB_PATH"
      - run: pnpm --filter @informach/recreio-app exec playwright install --with-deps chromium
      - name: Homologar pelo portal e pelo SDK com webhook real encaminhado
        run: pnpm --filter @informach/recreio-app homologar:stripe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recreio-stripe-jornada-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/recreio-stripe-journey.json
            ${{ runner.temp }}/recreio-stripe-journey-diagnostic.json
            ${{ runner.temp }}/recreio-stripe-local-catalog.json
          if-no-files-found: warn
          retention-days: 7
  sandbox-plans:
    if: github.event_name == 'workflow_dispatch' && !inputs.account_closure_probe && inputs.sandbox_plans
    name: Recreio / APIs Stripe com relógio de teste
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      DATABASE_URL: postgres://ci:ci@127.0.0.1:9/metadata_only
      STRIPE_SECRET_KEY: ${{ secrets.RECREIO_STRIPE_SANDBOX_SECRET_KEY }}
      STRIPE_EXPECTED_ACCOUNT: ${{ inputs.sandbox_account }}
      RECREIO_SANDBOX_PLANS_SCENARIO: ${{ inputs.sandbox_plans_scenario || 'monthly_upgrade' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @informach/recreio-app typecheck
      - run: pnpm --filter @informach/billing test -- src/__tests__/stripe-plans.test.ts src/__tests__/stripe-recreio-plans.test.ts src/__tests__/stripe-recreio-upgrades.test.ts src/__tests__/stripe-recreio-renewals.test.ts src/__tests__/payment-facts-native-portal.test.ts src/__tests__/stripe-proration-contract.test.ts src/__tests__/payment-facts-settlement.test.ts src/__tests__/payment-funding-facts.test.ts src/__tests__/stripe-legacy-deferral.test.ts
      - run: pnpm --filter @informach/recreio-app test -- src/features/cobranca/financiamento-regras.test.ts src/features/cobranca/financiamento-stripe.test.ts
      - name: Provar APIs e limpar apenas os recursos do próprio relógio
        run: pnpm --filter @informach/recreio-app homologar:stripe-agendas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recreio-stripe-provider-plans-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/recreio-stripe-provider-plans.json
            ${{ runner.temp }}/recreio-stripe-plans-catalog.json
          if-no-files-found: warn
          retention-days: 7
  verify:
    if: github.event_name != 'workflow_dispatch' || (!inputs.account_closure_probe && !inputs.sandbox_catalog && !inputs.sandbox_journey && !inputs.sandbox_plans && inputs.verification_gate != 'capacity')
    name: Recreio / ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(inputs.verification_gate == 'versoes' && '["versoes"]' || inputs.verification_gate == 'catalog-ui' && '["catalog-ui"]' || inputs.verification_gate == 'rights-ui' && '["rights-ui"]' || inputs.verification_gate == 'rights' && '["rights"]' || inputs.verification_gate == 'quality' && '["quality"]' || inputs.verification_gate == 'integration' && '["integration"]' || inputs.verification_gate == 'backup-capture' && '["backup-capture"]' || inputs.verification_gate == 'commercial-reconciliation' && '["commercial-reconciliation"]' || inputs.verification_gate == 'commercial-ui' && '["commercial-ui"]' || '["quality","integration","trial-setup","trial-experiment","trial-ui","trial-play","commercial-setup","commercial-checkout","commercial-ui","commercial-reconciliation","e2e","checkpoint","cliente","longa","versoes","equipe"]') }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      BETTER_AUTH_SECRET: ci-recreio-not-a-real-secret-xxxxxxxx
      BETTER_AUTH_URL: http://localhost:3009
      NEXT_PUBLIC_APP_URL: http://localhost:3009
      SENDGRID_API_KEY: SG.ci.not-sent
      SENDGRID_FROM: ci@example.test
      EMAIL_SANDBOX_MODE: memory
      CRON_SECRET: ci-recreio-not-a-real-secret-xxxxxxxx
      STRIPE_SECRET_KEY: sk_test_ci_not_sent
      STRIPE_WEBHOOK_SECRET: whsec_ci_not_sent
      STRIPE_MODE: dev
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.gate == 'quality'
        run: |
          pnpm check --diagnostic-level=error
          pnpm compasso:test:infrastructure
          pnpm --workspace-concurrency=1 --filter @informach/config --filter @informach/billing --filter @informach/auth --filter @informach/admin --filter @informach/recreio --filter @informach/recreio-app --filter @informach/morada-server --filter @informach/jogo-morada --filter @informach/morada-sim --filter @informach/morada-arte typecheck
          pnpm --workspace-concurrency=1 --filter @informach/config --filter @informach/billing --filter @informach/auth --filter @informach/admin --filter @informach/recreio --filter @informach/recreio-app --filter @informach/morada-server --filter @informach/jogo-morada --filter @informach/morada-sim --filter @informach/morada-arte test
      - name: Conferir upgrade dos artefatos pessoais a partir do schema anterior
        if: matrix.gate == 'rights' || matrix.gate == 'integration'
        run: |
          git fetch --no-tags --depth=1 origin 0cdbe71b2368e9905e815a843bd53d3d7a54ce1a
          pnpm --filter @informach/db exec tsx src/testing/recreio-group-upgrade.ts --copias
      - name: Conferir somente os direitos nativos (nao qualifica a rodada completa)
        if: matrix.gate == 'rights'
        run: |
          pnpm --filter @informach/recreio-app typecheck
          pnpm --filter @informach/recreio-app test:integration test/direitos-
      - if: matrix.gate == 'integration'
        run: pnpm --filter @informach/recreio-app test:integration
      - name: Preparar cliente nativo PostgreSQL 18 para a captura
        if: matrix.gate == 'integration' || matrix.gate == 'backup-capture'
        shell: bash
        run: |
          set -euo pipefail
          if ! test -x /usr/lib/postgresql/18/bin/pg_dump; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client-18
          fi
          /usr/lib/postgresql/18/bin/pg_dump --version | grep -E '^pg_dump \(PostgreSQL\) 18\.'
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      - name: Conferir captura global e reservas em outro banco descartavel
        if: matrix.gate == 'integration' || matrix.gate == 'backup-capture'
        run: |
          pnpm --filter @informach/db typecheck
          pnpm --filter @informach/recreio-app typecheck
          pnpm --filter @informach/db exec tsx src/testing/postgres-connection-loss.ts
          pnpm --filter @informach/morada-server exec esbuild ../../packages/db/src/testing/postgres-connection-loss.ts --platform=node --format=cjs --bundle --external:postgres --outfile=../../packages/db/node_modules/.cache/postgres-connection-loss.cjs
          node packages/db/node_modules/.cache/postgres-connection-loss.cjs
          pnpm --filter @informach/recreio-app test:backup-capture
      - if: matrix.gate == 'trial-setup'
        run: pnpm --filter @informach/recreio-app test:trial-setup
      - if: matrix.gate == 'trial-experiment'
        run: pnpm --filter @informach/recreio-app test:trial-experiment
      - if: matrix.gate == 'commercial-setup'
        run: pnpm --filter @informach/recreio-app test:commercial-setup
      - if: matrix.gate == 'commercial-checkout'
        run: pnpm --filter @informach/recreio-app test:commercial-checkout
      - if: matrix.gate == 'commercial-reconciliation'
        run: pnpm --filter @informach/recreio-app test:commercial-reconciliation
      - name: Verify administration safety projection on isolated PostgreSQL
        if: matrix.gate == 'integration'
        run: pnpm compasso:test:integration --admin-only
      - name: Upgrade Recreio groups with preserved profiles and progress
        if: matrix.gate == 'integration'
        run: |
          git fetch --no-tags --depth=1 origin 338236d041d3c7be0d4fb1fbbe0373a7101f8e07
          pnpm --filter @informach/db typecheck
          pnpm --filter @informach/db exec tsx src/testing/recreio-group-upgrade.ts
      - name: Upgrade Recreio worlds from deployed schema with retained bytes and members
        if: matrix.gate == 'integration'
        run: |
          git fetch --no-tags --depth=1 origin 396fe9326e3b1fac28a2b1bb86d9664c5b74e18a
          pnpm --filter @informach/db exec tsx src/testing/recreio-group-upgrade.ts --mundos
      - name: Verify production process receives SIGTERM
        if: matrix.gate == 'quality'
        run: |
          pnpm build:morada-server
          node --import tsx apps/morada-server/scripts/verificar-conteiner.mjs
        env:
          MORADA_PROCESSO_RELATORIO: ${{ runner.temp }}/morada-processo.json
      - name: Preserve process shutdown evidence
        if: always() && matrix.gate == 'quality'
        uses: actions/upload-artifact@v4
        with:
          name: morada-processo-${{ github.run_attempt }}
          path: ${{ runner.temp }}/morada-processo.json
          if-no-files-found: warn
          retention-days: 30
      - if: matrix.gate == 'e2e' || matrix.gate == 'rights-ui' || matrix.gate == 'catalog-ui' || matrix.gate == 'versoes' || matrix.gate == 'checkpoint' || matrix.gate == 'equipe' || matrix.gate == 'trial-ui' || matrix.gate == 'trial-play' || matrix.gate == 'commercial-ui'
        run: pnpm --filter @informach/recreio-app exec playwright install --with-deps chromium
      - if: matrix.gate == 'e2e'
        run: pnpm --filter @informach/recreio-app e2e
      - name: Conferir somente a interface de direitos (nao qualifica a rodada completa)
        if: matrix.gate == 'rights-ui'
        run: pnpm --filter @informach/recreio-app e2e e2e/direitos-
      - name: Conferir ficha publica (nao qualifica a rodada completa)
        if: matrix.gate == 'catalog-ui'
        run: pnpm --filter @informach/recreio-app e2e e2e/ficha-jogo.spec.ts
      - if: matrix.gate == 'equipe'
        run: pnpm --filter @informach/recreio-app e2e:equipe
      - if: matrix.gate == 'trial-ui'
        run: pnpm --filter @informach/recreio-app e2e:trial-setup
      - if: matrix.gate == 'commercial-ui'
        run: pnpm --filter @informach/recreio-app e2e:commercial-setup
      - name: Block external Stripe for synthetic plan UI
        if: matrix.gate == 'commercial-ui'
        run: echo '127.0.0.1 api.stripe.com' | sudo tee -a /etc/hosts
      - if: matrix.gate == 'commercial-ui'
        run: pnpm --filter @informach/recreio-app e2e:commercial-plans
      - if: matrix.gate == 'trial-play'
        run: pnpm --filter @informach/recreio-app e2e:trial-experiment
      - if: matrix.gate == 'checkpoint'
        run: pnpm --filter @informach/recreio-app e2e --config playwright.checkpoint.config.ts
        env:
          RECREIO_CHECKPOINT_MODE: "on"
      - if: matrix.gate == 'versoes'
        run: pnpm --filter @informach/recreio-app e2e:versoes
      - name: Ler o host publicado para a prova de protocolo
        if: matrix.gate == 'versoes'
        uses: actions/checkout@v4
        with:
          repository: informach/informach-apps
          ref: 644b3841cb81b24d04159f75892a4c21d4d5f094
          path: host-anterior
          persist-credentials: false
      - name: Instalar o host anterior sem compartilhar packages da candidata
        if: matrix.gate == 'versoes'
        working-directory: host-anterior
        run: pnpm install --frozen-lockfile
      - name: Provar as combinacoes com o servidor publicado real
        if: matrix.gate == 'versoes'
        env:
          MORADA_HOST_ANTERIOR_DIR: ${{ github.workspace }}/host-anterior
          MORADA_HOST_ANTERIOR_SHA: 644b3841cb81b24d04159f75892a4c21d4d5f094
          MORADA_COMPATIBILIDADE_RELATORIO: ${{ runner.temp }}/morada-compatibilidade.json
        run: |
          cp apps/morada-server/test/compatibilidade-executor.ts host-anterior/apps/morada-server/test/
          pnpm --filter @informach/jogo-morada exec vitest run src/rede/compatibilidade.test.ts
      - name: Compilar o servidor publicado para a jornada do portal novo
        if: matrix.gate == 'versoes'
        working-directory: host-anterior
        run: pnpm --filter @informach/morada-server build
      - name: Provar o portal novo com o servidor publicado
        if: matrix.gate == 'versoes'
        env:
          RECREIO_E2E_HOST_ANTERIOR_DIR: ${{ github.workspace }}/host-anterior/apps/morada-server
        run: pnpm --filter @informach/recreio-app e2e --grep @compatibilidade
      - if: matrix.gate == 'cliente'
        run: pnpm --filter @informach/jogo-morada exec playwright install --with-deps chromium
      - if: matrix.gate == 'cliente'
        run: pnpm --filter @informach/jogo-morada e2e
      - if: matrix.gate == 'longa'
        run: pnpm --filter @informach/morada-sim test:longa
        env:
          MORADA_LONGA_RELATORIO: ${{ runner.temp }}/morada-longa.json
      - name: Preserve long simulation evidence
        if: always() && matrix.gate == 'longa'
        uses: actions/upload-artifact@v4
        with:
          name: morada-cem-dias-${{ github.run_attempt }}
          path: ${{ runner.temp }}/morada-longa.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preservar prova das versoes do protocolo
        if: always() && matrix.gate == 'versoes'
        uses: actions/upload-artifact@v4
        with:
          name: morada-compatibilidade-${{ github.run_attempt }}
          path: ${{ runner.temp }}/morada-compatibilidade.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve synthetic browser failure evidence
        if: failure() && (matrix.gate == 'e2e' || matrix.gate == 'versoes' || matrix.gate == 'checkpoint' || matrix.gate == 'equipe' || matrix.gate == 'trial-ui' || matrix.gate == 'trial-play' || matrix.gate == 'commercial-ui')
        uses: actions/upload-artifact@v4
        with:
          name: recreio-${{ matrix.gate }}-${{ github.run_attempt }}
          path: apps/recreio/tmp/verification/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve synthetic account screens
        # Somente telas sintéticas explicitadas; sem traces ou conteúdo real de famílias.
        if: always() && (matrix.gate == 'e2e' || matrix.gate == 'rights-ui')
        uses: actions/upload-artifact@v4
        with:
          name: recreio-conta-${{ github.run_attempt }}
          path: |
            apps/recreio/tmp/telas/aparelhos-proprios.png
            apps/recreio/tmp/telas/direitos-previa-conta-sem-jogador.png
            apps/recreio/tmp/telas/direitos-copia-pessoal-390.png
            apps/recreio/tmp/telas/direitos-copia-conta-sem-jogador-390.png
            apps/recreio/tmp/telas/direitos-participacao-closing-390.png
            apps/recreio/tmp/telas/direitos-participacao-closed-390.png
            apps/recreio/tmp/telas/perfil-proprio-editado.png
            apps/recreio/tmp/telas/saida-mundo-confirmacao.png
            apps/recreio/tmp/telas/participacoes-sem-acesso.png
