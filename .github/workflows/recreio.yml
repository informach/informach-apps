name: Recreio

on:
  workflow_dispatch:
  push:
    branches: [main, "verify/recreio-*"]
    paths:
      - ".github/workflows/recreio.yml"
      - ".railway/railway.ts"
      - "apps/recreio/**"
      - "apps/admin/**"
      - "apps/morada-server/**"
      - "packages/recreio/**"
      - "packages/morada-sim/**"
      - "packages/morada-arte/**"
      - "packages/jogo-morada/**"
      - "packages/config/**"
      - "packages/db/**"
      - "packages/auth/**"
      - "packages/billing/**"
      - "packages/emails/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: recreio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Recreio / ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        gate: [quality, integration, trial-setup, trial-experiment, trial-ui, trial-play, commercial-setup, commercial-checkout, commercial-ui, e2e, checkpoint, cliente, longa, versoes, equipe]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      BETTER_AUTH_SECRET: ci-recreio-not-a-real-secret-xxxxxxxx
      BETTER_AUTH_URL: http://localhost:3009
      NEXT_PUBLIC_APP_URL: http://localhost:3009
      SENDGRID_API_KEY: SG.ci.not-sent
      SENDGRID_FROM: ci@example.test
      EMAIL_SANDBOX_MODE: memory
      CRON_SECRET: ci-recreio-not-a-real-secret-xxxxxxxx
      STRIPE_SECRET_KEY: sk_test_ci_not_sent
      STRIPE_WEBHOOK_SECRET: whsec_ci_not_sent
      STRIPE_MODE: dev
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.gate == 'quality'
        run: |
          pnpm check --diagnostic-level=error
          pnpm compasso:test:infrastructure
          pnpm --workspace-concurrency=1 --filter @informach/config --filter @informach/billing --filter @informach/auth --filter @informach/admin --filter @informach/recreio --filter @informach/recreio-app --filter @informach/morada-server --filter @informach/jogo-morada --filter @informach/morada-sim --filter @informach/morada-arte typecheck
          pnpm --workspace-concurrency=1 --filter @informach/config --filter @informach/billing --filter @informach/auth --filter @informach/admin --filter @informach/recreio --filter @informach/recreio-app --filter @informach/morada-server --filter @informach/jogo-morada --filter @informach/morada-sim --filter @informach/morada-arte test
      - if: matrix.gate == 'integration'
        run: pnpm --filter @informach/recreio-app test:integration
      - if: matrix.gate == 'trial-setup'
        run: pnpm --filter @informach/recreio-app test:trial-setup
      - if: matrix.gate == 'trial-experiment'
        run: pnpm --filter @informach/recreio-app test:trial-experiment
      - if: matrix.gate == 'commercial-setup'
        run: pnpm --filter @informach/recreio-app test:commercial-setup
      - if: matrix.gate == 'commercial-checkout'
        run: pnpm --filter @informach/recreio-app test:commercial-checkout
      - name: Verify administration safety projection on isolated PostgreSQL
        if: matrix.gate == 'integration'
        run: pnpm compasso:test:integration --admin-only
      - name: Upgrade Recreio groups with preserved profiles and progress
        if: matrix.gate == 'integration'
        run: |
          git fetch --no-tags --depth=1 origin 338236d041d3c7be0d4fb1fbbe0373a7101f8e07
          pnpm --filter @informach/db typecheck
          pnpm --filter @informach/db exec tsx src/testing/recreio-group-upgrade.ts
      - name: Upgrade Recreio worlds from deployed schema with retained bytes and members
        if: matrix.gate == 'integration'
        run: |
          git fetch --no-tags --depth=1 origin 396fe9326e3b1fac28a2b1bb86d9664c5b74e18a
          pnpm --filter @informach/db exec tsx src/testing/recreio-group-upgrade.ts --mundos
      - name: Verify production process receives SIGTERM
        if: matrix.gate == 'quality'
        run: |
          pnpm build:morada-server
          node apps/morada-server/scripts/verificar-conteiner.mjs
        env:
          MORADA_PROCESSO_RELATORIO: ${{ runner.temp }}/morada-processo.json
      - name: Preserve process shutdown evidence
        if: always() && matrix.gate == 'quality'
        uses: actions/upload-artifact@v4
        with:
          name: morada-processo-${{ github.run_attempt }}
          path: ${{ runner.temp }}/morada-processo.json
          if-no-files-found: warn
          retention-days: 30
      - if: matrix.gate == 'e2e' || matrix.gate == 'versoes' || matrix.gate == 'checkpoint' || matrix.gate == 'equipe' || matrix.gate == 'trial-ui' || matrix.gate == 'trial-play' || matrix.gate == 'commercial-ui'
        run: pnpm --filter @informach/recreio-app exec playwright install --with-deps chromium
      - if: matrix.gate == 'e2e'
        run: pnpm --filter @informach/recreio-app e2e
      - if: matrix.gate == 'equipe'
        run: pnpm --filter @informach/recreio-app e2e:equipe
      - if: matrix.gate == 'trial-ui'
        run: pnpm --filter @informach/recreio-app e2e:trial-setup
      - if: matrix.gate == 'commercial-ui'
        run: pnpm --filter @informach/recreio-app e2e:commercial-setup
      - if: matrix.gate == 'trial-play'
        run: pnpm --filter @informach/recreio-app e2e:trial-experiment
      - if: matrix.gate == 'checkpoint'
        run: pnpm --filter @informach/recreio-app e2e --config playwright.checkpoint.config.ts
        env:
          RECREIO_CHECKPOINT_MODE: "on"
      - if: matrix.gate == 'versoes'
        run: pnpm --filter @informach/recreio-app e2e:versoes
      - if: matrix.gate == 'cliente'
        run: pnpm --filter @informach/jogo-morada exec playwright install --with-deps chromium
      - if: matrix.gate == 'cliente'
        run: pnpm --filter @informach/jogo-morada e2e
      - if: matrix.gate == 'longa'
        run: pnpm --filter @informach/morada-sim test:longa
        env:
          MORADA_LONGA_RELATORIO: ${{ runner.temp }}/morada-longa.json
      - name: Preserve long simulation evidence
        if: always() && matrix.gate == 'longa'
        uses: actions/upload-artifact@v4
        with:
          name: morada-cem-dias-${{ github.run_attempt }}
          path: ${{ runner.temp }}/morada-longa.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve synthetic browser failure evidence
        if: failure() && (matrix.gate == 'e2e' || matrix.gate == 'versoes' || matrix.gate == 'checkpoint' || matrix.gate == 'equipe')
        uses: actions/upload-artifact@v4
        with:
          name: recreio-${{ matrix.gate }}-${{ github.run_attempt }}
          path: apps/recreio/tmp/verification/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve synthetic account screens
        # Somente telas sintéticas explicitadas; sem traces ou conteúdo real de famílias.
        if: always() && matrix.gate == 'e2e'
        uses: actions/upload-artifact@v4
        with:
          name: recreio-conta-${{ github.run_attempt }}
          path: |
            apps/recreio/tmp/telas/aparelhos-proprios.png
            apps/recreio/tmp/telas/perfil-proprio-editado.png
            apps/recreio/tmp/telas/saida-mundo-confirmacao.png
            apps/recreio/tmp/telas/participacoes-sem-acesso.png
            apps/recreio/tmp/telas/responsabilidade-recebida.png
            apps/recreio/tmp/telas/responsabilidade-mobile.png
            apps/recreio/tmp/telas/responsabilidade-recebida-mobile.png
            apps/recreio/tmp/telas/remocao-membro-mobile.png
            apps/recreio/tmp/telas/familia-cadastro-sem-jogador.png
            apps/recreio/tmp/telas/aparelho-pareado-protegido.png
            apps/recreio/tmp/telas/aparelho-pareado-mobile.png
            apps/recreio/tmp/telas/aparelhos-menor-mobile.png
            apps/recreio/tmp/telas/pin-nativo-sem-jogador.png
            apps/recreio/tmp/telas/supervisao-mobile.png
            apps/recreio/tmp/telas/supervisao-horarios-mobile.png
            apps/recreio/tmp/telas/supervisao-confirmacao-mobile.png
            apps/recreio/tmp/telas/perfil-compartilhado-mobile.png
            apps/recreio/tmp/telas/retorno-adulto-pin-mobile.png
            apps/recreio/tmp/telas/estante-protegida-mobile.png
            apps/recreio/tmp/telas/grupo-cobertura-celular.png
            apps/recreio/tmp/telas/grupo-convite-celular.png
            apps/recreio/tmp/telas/grupo-participacao-celular.png
            apps/recreio/tmp/telas/social-adulto-mobile.png
            apps/recreio/tmp/telas/social-infantil-mobile.png
            apps/recreio/tmp/telas/social-responsavel-sem-jogador-mobile.png
            apps/recreio/tmp/telas/social-denuncia-mobile.png
            apps/recreio/tmp/telas/recurso-titular-mobile.png
            apps/recreio/tmp/telas/recurso-responsavel-mobile.png
            apps/recreio/tmp/telas/denuncia-acompanhamento-mobile.png
            apps/recreio/tmp/telas/host-social-mobile-topo.png
            apps/recreio/tmp/telas/host-social-mobile-cuidados.png
            apps/recreio/tmp/telas/host-controle-morada-mobile.png
            apps/recreio/tmp/telas/host-social-morada-mobile.png
            apps/recreio/tmp/telas/mundos-gestao-mobile.png
            apps/recreio/tmp/telas/mundos-menor-gestao-mobile.png
            apps/recreio/tmp/telas/participantes-protecao-mobile.png
            apps/recreio/tmp/telas/convites-dirigidos-partida-mobile.png
            apps/recreio/tmp/telas/convites-responsavel-mobile.png
            apps/recreio/tmp/telas/convites-portal-mobile.png
            apps/recreio/tmp/telas/sucessao-menor-mobile.png
            apps/recreio/tmp/telas/visitas-responsavel-mobile.png
            apps/recreio/tmp/telas/visitas-aceite-mobile.png
            apps/recreio/tmp/telas/visitas-gestao-mobile.png
            apps/recreio/tmp/telas/visitas-partida-manual-mobile.png
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve synthetic visit transition screens
        if: always() && matrix.gate == 'checkpoint'
        uses: actions/upload-artifact@v4
        with:
          name: recreio-visitas-checkpoint-${{ github.run_attempt }}
          path: |
            apps/recreio/tmp/telas/visitas-gestao-mobile.png
            apps/recreio/tmp/telas/visitas-partida-mobile.png
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve synthetic trial consent screens
        if: always() && matrix.gate == 'trial-ui'
        uses: actions/upload-artifact@v4
        with:
          name: recreio-teste-telas-${{ github.run_attempt }}
          path: |
            apps/recreio/tmp/telas/teste-consentimento-mobile.png
            apps/recreio/tmp/telas/teste-recibo-mobile.png
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve synthetic purchase consent screens
        if: always() && matrix.gate == 'commercial-ui'
        uses: actions/upload-artifact@v4
        with:
          name: recreio-compra-telas-${{ github.run_attempt }}
          path: |
            apps/recreio/tmp/telas/compra-ofertas-mobile.png
            apps/recreio/tmp/telas/compra-recibo-mobile.png
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve synthetic first-session screens
        if: always() && matrix.gate == 'trial-play'
        uses: actions/upload-artifact@v4
        with:
          name: recreio-teste-inicio-telas-${{ github.run_attempt }}
          path: |
            apps/recreio/tmp/telas/teste-mundo-preparado-mobile.png
            apps/recreio/tmp/telas/teste-primeira-sessao-mobile.png
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve synthetic staff queue screen
        if: always() && matrix.gate == 'equipe'
        uses: actions/upload-artifact@v4
        with:
          name: recreio-equipe-tela-${{ github.run_attempt }}
          path: apps/recreio/tmp/telas/equipe-seguranca-mobile.png
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve synthetic color evidence
        if: always() && matrix.gate == 'cliente'
        uses: actions/upload-artifact@v4
        with:
          name: morada-cores-sinteticas-${{ github.run_attempt }}
          path: packages/jogo-morada/e2e/test-results/**/cores-parametricas.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve cross-build evidence
        if: always() && matrix.gate == 'versoes'
        uses: actions/upload-artifact@v4
        with:
          name: recreio-versoes-medidas-${{ github.run_attempt }}
          path: apps/recreio/tmp/telas/troca-de-versao.json
          if-no-files-found: warn
          retention-days: 30
