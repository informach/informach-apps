services:
  postgres:
    image: postgres:16-alpine
    container_name: informach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: informach
      POSTGRES_PASSWORD: informach
      POSTGRES_DB: informach
    ports:
      - "5432:5432"
    volumes:
      - informach-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U informach -d informach"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: informach-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - informach-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  informach-postgres-data:
  informach-redis-data:
