  <style>

    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #2266ab;outline-offset:4px}button{color:inherit}a{color:var(--green)}.skip{position:absolute;top:-100px;left:12px;background:white;padding:12px;z-index:10}.skip:focus{top:12px}
    .concept{background:#203930;color:#fff;padding:12px 24px;display:flex;gap:18px;align-items:center;justify-content:space-between;font-size:12px}.concept strong{font-size:13px}.concept select{max-width:100%;background:#314b40;color:white;border:1px solid #8b9c91;border-radius:8px;padding:8px}.concept label{display:flex;gap:10px;align-items:center}.top{max-width:1180px;margin:auto;padding:22px 28px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:20px;font-weight:800;letter-spacing:-.7px;display:flex;gap:10px;align-items:center}.brand svg{width:34px;height:34px}.top-right{display:flex;align-items:center;gap:16px}.context{font-size:13px;color:var(--muted)}.tag{font-size:12px;display:inline-block;font-weight:700;padding:5px 10px;border-radius:7px;background:var(--pale);color:#285a35}.shell{max-width:1180px;margin:auto;padding:18px 28px 70px;display:grid;grid-template-columns:180px 1fr;gap:44px}.nav{display:flex;flex-direction:column;gap:6px;padding-top:5px}.nav button{border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:10px;font-size:14px;font-weight:600;min-height:46px}.nav button[aria-current=page]{background:var(--pale);color:#145a32}.nav small{color:var(--muted);padding:14px;line-height:1.7;margin-top:25px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);font-weight:700;margin:0 0 10px}h1{font-size:clamp(28px,3vw,38px);line-height:1.2;letter-spacing:-1.3px;margin:0 0 14px}h2{font-size:21px;line-height:1.3;margin:0 0 12px;letter-spacing:-.4px}h3{font-size:17px;margin:0 0 7px}p{margin:0 0 14px}.lead{color:var(--muted);max-width:620px}.heading{margin:4px 0 28px}.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:26px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:16px}.profile{display:flex;align-items:center;gap:12px;margin-bottom:20px}.avatar{width:44px;height:44px;background:#e0ecf6;display:grid;place-items:center;border-radius:14px;font-size:22px}.avatar.gold{background:var(--amber)}.meta{color:var(--muted);font-size:13px}.quiet{color:var(--muted);font-size:14px}.btn{border:1px solid var(--green);background:var(--green);color:white;display:inline-flex;align-items:center;justify-content:center;gap:12px;border-radius:10px;padding:12px 18px;min-height:48px;font-size:14px;font-weight:700;text-decoration:none}.btn.secondary{background:transparent;border-color:var(--line);color:var(--ink)}.link{background:none;border:0;color:var(--green);padding:10px 0;font-size:14px;font-weight:650;text-align:left;min-height:44px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.support{background:var(--amber);border-radius:12px;padding:16px;margin-top:22px;font-size:14px}.support .eyebrow{font-size:10px;margin-bottom:6px}.support p:last-child{margin:0}.section-title{margin:30px 0 15px}.item{display:flex;gap:15px;padding:18px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0;padding-bottom:0}.item p{margin:0}.dot{height:9px;width:9px;flex-shrink:0;background:var(--green);border-radius:50%;margin-top:8px}.footer-note{font-size:12px;color:var(--muted);margin-top:28px}.hero{background:var(--pale);border:1px solid #c6dcbc;border-radius:24px;padding:30px;display:grid;grid-template-columns:1.25fr 1fr;gap:30px;align-items:center}.hero h2{font-size:30px;letter-spacing:-1px;line-height:1.2;margin:12px 0}.hero .btn{margin-top:12px}.math{padding:24px;border-radius:18px;background:#fbfff5;position:relative}.math .fraction{display:flex;gap:5px;height:66px;margin:12px 0}.fraction span{background:#dfe8d8;flex:1;border:1px solid #a6b59c;border-radius:5px}.fraction span.filled{background:#73a456}.math figcaption{color:var(--muted);font-size:12px;margin-top:12px}.math figure{margin:0}.math-equation{display:flex;justify-content:center;align-items:center;gap:24px;padding:25px 0;font-size:38px;font-weight:500}.stack{display:flex;flex-direction:column;text-align:center;line-height:1.1;font-size:25px}.stack span:first-child{border-bottom:2px solid;padding-bottom:5px}.stack span:last-child{padding-top:5px}.below{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.below .panel{padding:22px}.below p{font-size:14px;color:var(--muted)}.dayline{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:20px;margin-top:25px;font-size:14px}.dayline span{font-size:22px;color:var(--green)}.teen .hero{background:var(--blue);border-color:#c8d7e1;border-radius:14px}.teen .math{background:#f9fcfe;border-radius:8px}.teen .hero h2{font-size:29px}.teen .tag{background:#d8e9f3;color:#29576a}.teen .panel{border-radius:14px}.steps{display:flex;gap:12px;margin:0 0 28px;padding:0;list-style:none;color:var(--muted);font-size:13px}.steps li{border-top:3px solid var(--line);padding-top:10px;flex:1}.steps .active{border-color:var(--green);color:var(--green);font-weight:700}.setup{max-width:620px;margin:auto}.setup .panel{padding:32px}.field{display:flex;flex-direction:column;gap:8px;margin:20px 0}.field label{font-size:14px;font-weight:600}.field input,.field select{border:1px solid #91a491;background:#fff;border-radius:9px;padding:12px;width:100%;min-height:48px}.check{display:flex;gap:12px;align-items:flex-start;font-size:13px}.check input{margin-top:4px;width:19px;height:19px;flex-shrink:0}.choice{border:2px solid #6b946a;border-radius:13px;padding:20px;background:#f0f7e9;margin:20px 0}.choice p:last-child{margin:0}.done{max-width:670px;margin:15px auto}.done .panel{padding:38px}.seal{width:52px;height:52px;border-radius:50%;background:var(--pale);color:var(--green);display:grid;place-items:center;font-size:25px;margin-bottom:22px}.progress-note{padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:24px 0;color:var(--muted);font-size:14px}dialog{border:1px solid var(--line);border-radius:18px;max-width:520px;width:calc(100% - 32px);padding:28px;color:var(--ink);background:var(--white)}dialog::backdrop{background:#172b23a8}dialog h2{padding-right:28px}.close{float:right;border:0;background:none;font-size:25px;min-width:44px;min-height:44px;margin:-12px -12px 0 0}.dialog-actions{margin-top:24px}.screen-reader{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
    @media(max-width:800px){.concept{padding:10px 16px;align-items:flex-start;gap:10px;flex-direction:column}.concept label{width:100%;justify-content:space-between}.concept select{max-width:65%}.top{padding:18px 18px}.brand{font-size:18px}.context{display:none}.top-right{gap:8px}.top-right .link{font-size:12px}.shell{display:block;padding:10px 18px 100px}.nav{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--line);padding:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:0;z-index:3}.nav button{font-size:11px;text-align:center;padding:8px 3px;border-radius:6px}.nav small{display:none}.heading{margin-top:10px;margin-bottom:22px}.two,.below{grid-template-columns:1fr}.hero{grid-template-columns:1fr;gap:22px;padding:23px}.hero h2{font-size:27px}.hero .btn{width:100%}.math{padding:16px}.math .fraction{height:42px}.math-equation{padding:12px 0}.panel{padding:22px}.setup .panel,.done .panel{padding:24px}.steps{font-size:11px;gap:8px}.actions .btn{flex:1;min-width:155px}.footer-note{margin-bottom:12px}}
    @media(max-width:420px){.top{flex-wrap:wrap}.top-right{margin-left:auto}}
    @media(prefers-reduced-motion:no-preference){.btn:hover{filter:brightness(.94)}button{transition:background-color .15s}}

<body>
  <a href="#main" class="skip">Pular para o conteúdo</a>
  <div class="concept"><div><strong>PROPOSTA · MISSÃO SABER</strong><br>Conceito navegável · dados ilustrativos · sem conta ou salvamento real</div><label for="scenario">Ver cenário <select id="scenario"><option value="parent">Responsável · acompanhamento</option><option value="setup">Responsável · primeiro acesso</option><option value="student">Estudante · anos iniciais</option><option value="teen">Estudante · ensino médio</option><option value="finish">Estudante · conclusão</option></select></label></div>
  <header class="top"><div class="brand"><svg viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="9" fill="#007549"/><path d="M7 11h8l3 3 3-3h8v16h-8l-3 2-3-2H7z" fill="#e0f99d"/><path d="M18 14v15" stroke="#007549" stroke-width="2"/></svg>missão saber</div><div class="top-right" id="identity"></div></header>
  <div class="shell"><nav class="nav" aria-label="Navegação principal" id="nav"></nav><main id="main" tabindex="-1"></main></div>
  <dialog id="info"><button type="button" class="close" aria-label="Fechar explicação" id="close">×</button><h2 id="dialog-title">Informações</h2><div id="dialog-body"></div><div class="dialog-actions" id="dialog-actions"></div></dialog>
  <script>
    const main=document.querySelector('#main'),nav=document.querySelector('#nav'),identity=document.querySelector('#identity'),scenario=document.querySelector('#scenario'),dialog=document.querySelector('#info');
    let current='parent',step=1,studentName='Lua',lastStudent='student';
    const escapeText=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function note(title,body,action=''){document.querySelector('#dialog-title').textContent=title;document.querySelector('#dialog-body').innerHTML=body;document.querySelector('#dialog-actions').innerHTML=action;dialog.showModal()}
    function button(label,target,secondary=false){return `<button class="btn ${secondary?'secondary':''}" data-view="${target}">${label}</button>`}
    function frame(parent){const activeStudent=current==='finish'?lastStudent:current;identity.innerHTML=parent?'<span class="tag">Área do responsável</span>':'<span class="tag">'+(activeStudent==='teen'?'Davi':escapeText(studentName))+'</span><button class="link" data-note="unlock">Área do responsável</button>';const labels=parent?['Visão geral','Estudantes','Acompanhamento','Conta']:['Hoje','Minha trilha','Laboratório','Caderno'];nav.innerHTML=labels.map((label,i)=>`<button ${i===0?'aria-current="page"':''} ${i===0?`data-view="${parent?'parent':activeStudent==='teen'?'teen':'student'}"`:`data-note="${label}"`}>${label}</button>`).join('')+'<small>Uma ideia de cada vez.<br>Aprender também é poder tentar.</small>'}
    function parentView(){return `<div class="heading"><p class="eyebrow">Área do responsável</p><h1>O que estão descobrindo?</h1><p class="lead">Veja como o estudo está acontecendo e encontre uma maneira simples de apoiar.</p></div><div class="two"><article class="panel"><div class="profile"><span class="avatar" aria-hidden="true">◒</span><div><h3>${escapeText(studentName)}</h3><div class="meta">3º ano · OBMEP Mirim N1</div></div></div><span class="tag">Estudou hoje</span><h2 style="margin-top:15px">Uma metade, vários jeitos</h2><p class="quiet">Praticou comparar partes de um inteiro. Ainda estamos observando como usa essa ideia em outras situações.</p><div class="support"><p class="eyebrow">Uma conversa para hoje</p><p>“Como você mostraria uma metade de dois jeitos diferentes?”</p></div><div class="actions"><button class="btn" data-note="report">Ver acompanhamento</button></div><button class="link" data-view="student">Abrir estudo de ${escapeText(studentName)} →</button></article><article class="panel"><div class="profile"><span class="avatar gold" aria-hidden="true">↗</span><div><h3>Davi</h3><div class="meta">2ª série do EM · OBMEP N3</div></div></div><span class="tag">Missão em andamento</span><h2 style="margin-top:15px">Como uma função varia</h2><p class="quiet">Pode continuar de onde parou. As respostas já confirmadas permanecem guardadas.</p><div class="support"><p class="eyebrow">Apoio com autonomia</p><p>Combinem um bom momento para continuar. Não é necessário terminar tudo hoje.</p></div><div class="actions"><button class="btn secondary" data-note="report-teen">Ver acompanhamento</button></div><button class="link" data-view="teen">Abrir estudo de Davi →</button></article></div><h2 class="section-title">Seu acompanhamento, sem pressa</h2><div class="panel"><div class="item"><span class="dot"></span><div><h3>Um combinado que cabe na rotina</h3><p class="quiet">O tempo é uma orientação. Dias sem estudo não geram dívida.</p><button class="link" data-note="routine">Rever o combinado →</button></div></div><div class="item"><span class="dot"></span><div><h3>Planos, perfis e dados em um lugar próprio</h3><p class="quiet">Administre a conta sem interromper o percurso de quem está estudando.</p><button class="link" data-note="Conta">Abrir configurações da conta →</button></div></div></div><p class="footer-note">Os exemplos desta tela são fictícios. Relatos reais devem ser sustentados pelas tentativas registradas.</p>`}
    function studentView(teen){const name=teen?'Davi':escapeText(studentName);return `<div class="${teen?'teen':''}"><div class="heading"><p class="eyebrow">Seu espaço de estudo · ${teen?'2ª série do ensino médio':'3º ano'}</p><h1>${teen?'Continue de onde parou, Davi.':`Vamos descobrir, ${name}?`}</h1><p class="lead">${teen?'Suas respostas confirmadas estão guardadas.':'Uma ideia para experimentar hoje, com espaço para pedir ajuda.'}</p></div><section class="hero" aria-labelledby="mission-title"><div><span class="tag">${teen?'Sua missão · questão 3 de 6':'Sua primeira missão'}</span><h2 id="mission-title">${teen?'Como uma função varia':'Uma metade,<br>vários jeitos'}</h2><p>${teen?'Relacione a mudança no gráfico com a regra da função.':'Descubra como partes diferentes podem mostrar a mesma quantidade.'}</p><p class="quiet">${teen?'Vamos continuar a atividade que você deixou em andamento.':'Este é o começo da sua trilha. Você pode tentar e pedir uma pista.'}</p><button class="btn" data-note="mission">${teen?'Continuar missão':'Começar minha missão'} <span aria-hidden="true">→</span></button><p class="meta" style="margin:12px 0 0">Seu combinado: 10 minutos · pode pausar quando precisar</p></div><div class="math">${teen?'<figure><svg viewBox="0 0 240 170" role="img" aria-label="Exemplo ilustrativo de uma reta crescente em um plano cartesiano"><g stroke="#dce7ec" stroke-width="1"><path d="M30 15v130M75 15v130M120 15v130M165 15v130M210 15v130M30 30h180M30 65h180M30 100h180"/></g><path d="M30 15v130h190" fill="none" stroke="#758b94" stroke-width="2"/><path d="M30 120L210 30" stroke="#007549" stroke-width="4"/><circle cx="120" cy="75" r="6" fill="#007549"/></svg><figcaption>Como a inclinação se relaciona com a variação?</figcaption></figure>':'<figure role="img" aria-label="Um retângulo com uma de duas partes pintada e outro com duas de quatro partes pintadas: ambos representam metade."><div class="fraction"><span class="filled"></span><span></span></div><div class="fraction"><span class="filled"></span><span class="filled"></span><span></span><span></span></div><div class="math-equation"><span class="stack"><span>1</span><span>2</span></span><span>=</span><span class="stack"><span>2</span><span>4</span></span></div><figcaption>Dois jeitos de mostrar a mesma parte.</figcaption></figure>'}</div></section><div class="below"><article class="panel"><p class="eyebrow">Quer experimentar?</p><h3>${teen?'Investigue no laboratório':'Mexa nas partes'}</h3><p>${teen?'Explore a ideia da missão com uma representação interativa.':'Use o laboratório para montar partes e comparar o que muda.'}</p><button class="link" data-note="lab">Abrir esta ideia no laboratório →</button></article><article class="panel"><p class="eyebrow">${teen?'Seu caminho':'Por onde começar'}</p><h3>${teen?'Veja o que vem depois':'Já conhece esse assunto?'}</h3><p>${teen?'Consulte a trilha, as revisões e outras atividades do seu ano.':'O diagnóstico ajuda a escolher um começo. Você também pode ir direto para a missão.'}</p><button class="link" data-note="${teen?'Minha trilha':'diagnostic'}">${teen?'Ver minha trilha':'Conhecer meu ponto de partida'} →</button></article></div><div class="dayline"><span aria-hidden="true">✓</span><p style="margin:0">${teen?'Você escolhe quando parar. O estudo pode continuar outro dia.':'Pode pedir ajuda. Aqui, tentar faz parte de aprender.'}</p></div></div>`}
    function setupView(){const labels=['Quem vai estudar','Por onde começar','Tudo pronto'];return `<div class="setup"><div class="heading"><p class="eyebrow">Primeiro acesso · responsável</p><h1>Vamos preparar o primeiro estudo.</h1><p class="lead">Depois, você poderá acompanhar o aprendizado pelo seu painel.</p></div><ol class="steps" aria-label="Etapas de preparação">${labels.map((s,i)=>`<li ${step===i+1?'class="active" aria-current="step"':''}>${i+1}. ${s}</li>`).join('')}</ol><div class="panel">${step===1?`<h2>Quem vai estudar?</h2><form id="setup-form"><div class="field"><label for="nickname">Apelido do estudante</label><input id="nickname" name="nickname" required maxlength="30" value="${escapeText(studentName)}" autocomplete="off"><span class="meta">Não precisa do nome completo.</span></div><div class="field"><label for="grade">Ano escolar</label><select id="grade"><option>3º ano · exemplo deste conceito</option></select></div><p class="quiet">Avatar e outras preferências podem ser escolhidos depois.</p><label class="check"><input type="checkbox" required>Sou responsável legal e autorizo a criação do perfil e o registro da aprendizagem. No app, os detalhes e a política serão apresentados aqui.</label><div class="actions"><button class="btn" type="submit">Continuar →</button></div></form>`:step===2?`<h2>Um começo para ${escapeText(studentName)}</h2><p class="quiet">A sugestão considera o ano escolar. Você pode mudar de trilha depois.</p><div class="choice"><span class="tag">Sugestão para começar</span><h3 style="margin-top:12px">OBMEP Mirim · Nível 1</h3><p class="quiet">Desafios com números, formas e estratégias para os primeiros anos do ensino fundamental.</p></div><button class="link" data-note="trails">Comparar com outras trilhas →</button><div class="actions"><button class="btn" data-step="3">Usar esta trilha →</button><button class="btn secondary" data-step="1">Voltar</button></div>`:`<div class="seal" aria-hidden="true">✓</div><h2>Tudo pronto para ${escapeText(studentName)}.</h2><p>O primeiro estudo começa com uma missão curta. Há pistas e espaço para tentar.</p><div class="support"><p><strong>Agora é a vez de ${escapeText(studentName)}.</strong></p><p>Você pode ajudar na leitura. Deixe que as respostas expressem o jeito de pensar de quem está estudando.</p></div><div class="actions">${button(`Começar estudo com ${escapeText(studentName)}`,'student')}${button('Ir para meu painel','parent',true)}</div><p class="footer-note">Rotina e preferências podem ser ajustadas depois.</p>`}</div></div>`}
    function finishView(){const teen=lastStudent==='teen';return `<div class="done"><div class="panel"><div class="seal" aria-hidden="true">✓</div><p class="eyebrow">Seu estudo de hoje</p><h1>Uma ideia para levar com você.</h1><p class="lead">${teen?'Você explorou como a variação de uma função aparece no gráfico.':'Você explorou como uma metade pode ser representada de jeitos diferentes.'}</p><div class="progress-note">No aplicativo, esta mensagem aparece somente depois da confirmação de salvamento. Aqui, a conclusão é uma simulação.</div><p>Você pode encerrar por hoje e continuar outro dia.</p><div class="actions"><button class="btn" data-note="end">Encerrar por hoje</button><button class="btn secondary" data-view="${lastStudent}">Continuar aprendendo</button></div><button class="link" style="margin-top:16px" data-note="Caderno">Quero guardar como pensei no caderno →</button></div></div>`}
    function show(view,focus=true){current=view;if(view==='student'||view==='teen')lastStudent=view;scenario.value=view;frame(view==='parent'||view==='setup');main.innerHTML=view==='parent'?parentView():view==='setup'?setupView():view==='finish'?finishView():studentView(view==='teen');window.scrollTo(0,0);if(focus)main.focus({preventScroll:true})}
    const notes={
      unlock:['Voltar à área do responsável','<p>No aplicativo, esta passagem pedirá a confirmação do responsável. O estudante não recupera permissões adultas apenas escolhendo um botão.</p><p class="quiet">Este conceito não implementa autenticação. Use o seletor de cenários para comparar os espaços.</p>'],
      report:['Acompanhamento do estudante','<p><strong>O que está aprendendo:</strong> representar e comparar partes de um inteiro.</p><p><strong>O que observamos:</strong> prática em duas situações. Ainda não é suficiente para afirmar domínio.</p><p><strong>Como apoiar:</strong> peça que mostre a mesma metade de dois jeitos.</p><p class="quiet">Exemplo fictício. A tela final permitirá abrir tentativas e critérios de evidência.</p>'],
      'report-teen':['Acompanhamento com autonomia','<p>Apresentar os assuntos estudados e os próximos passos. Distinguir prática de evidência de autonomia.</p><p>O estudante deve saber quais informações são compartilhadas com o responsável.</p>'],
      routine:['Um combinado possível','<p>A rotina é uma sugestão, não um prazo para terminar a missão. Dias sem uso não geram punição.</p><p>A configuração atual é familiar. Preferências por estudante exigem uma evolução específica.</p>'],
      Conta:['Conta do responsável','<p>Assinatura, pagamentos, dispositivos autorizados, exportação e privacidade ficam neste espaço.</p><p>Ações sensíveis continuam exigindo confirmação adequada.</p>'],
      Estudantes:['Estudantes da família','<p>Criar e editar perfis, escolher trilhas elegíveis e abrir explicitamente o estudo de uma pessoa.</p><p>Ao entregar o aparelho, o contexto muda para estudo com permissões restritas.</p>'],
      Acompanhamento:['Acompanhar um estudante','<p>Escolher o estudante e ver: o que está aprendendo, quais evidências existem e como apoiar.</p><p>Detalhes técnicos e tentativas ficam disponíveis sem ocupar toda a abertura.</p>'],
      mission:['Prévia do percurso da missão','<p>No aplicativo: responder, pedir uma pista se necessário, conferir a ideia e continuar. A missão e suas regras pedagógicas existentes são preservadas.</p><p class="quiet">O botão abaixo apenas demonstra o fechamento. Nenhuma resposta ou evidência será registrada.</p>'],
      lab:['Laboratório ligado à missão','<p>Abrir a ferramenta, o modo e o contexto adequados à habilidade e ao ano escolar.</p><p>O estudante pode investigar e voltar à missão de origem. A biblioteca continua acessível para exploração livre.</p>'],
      Laboratório:['Biblioteca do laboratório','<p>Começar pela investigação recomendada ou retomar uma experiência. Explorar outras ferramentas adequadas ao ano escolar fica como opção.</p>'],
      'Minha trilha':['O caminho e as alternativas','<p>A trilha mostra onde o estudante está e quais assuntos pode estudar. Revisões e simulados têm acessos nomeados aqui.</p><p>As revisões também aparecem em Hoje quando indicadas pelo motor pedagógico.</p>'],
      diagnostic:['Conhecer meu ponto de partida','<p>O diagnóstico ajuda a escolher a próxima atividade. Não precisa ser uma barreira para começar a estudar.</p><p>Depois dele, apresentar uma missão específica e explicar a indicação.</p>'],
      Caderno:['Guardar como pensei','<p>Registrar uma descoberta com as próprias palavras, ligada à missão ou investigação de origem.</p><p>O registro pode ficar para depois; escrever não é uma obrigação ao final de toda atividade.</p>'],
      trails:['Escolher com uma explicação','<p>Comparar somente trilhas elegíveis para o ano, com exemplos de assunto, objetivo e motivo da sugestão.</p><p>Neste conceito, o perfil do 3º ano usa OBMEP Mirim N1. A comparação completa pertence à implementação.</p>'],
      end:['Por hoje, está combinado.','<p>O aplicativo deve encerrar a sessão de estudo de forma clara, confirmar o que foi salvo e permitir voltar outro dia.</p><p class="quiet">Fim do percurso demonstrativo. Os dados desta proposta são ilustrativos.</p>']
    };
    document.addEventListener('click',event=>{const target=event.target.closest('button');if(!target)return;if(target.dataset.view){if(dialog.open)dialog.close();show(target.dataset.view)}if(target.dataset.step){step=Number(target.dataset.step);show('setup')}if(target.dataset.note){const key=target.dataset.note,entry=notes[key];note(entry[0],entry[1],key==='mission'?'<button class="btn" data-view="finish">Ver conclusão simulada →</button>':'')}});
    document.addEventListener('submit',event=>{if(event.target.id==='setup-form'){event.preventDefault();studentName=document.querySelector('#nickname').value.trim()||'Lua';step=2;show('setup')}});
    document.querySelector('#close').addEventListener('click',()=>dialog.close());scenario.addEventListener('change',()=>{if(scenario.value==='setup')step=1;show(scenario.value)});show('parent',false);
  </script>
</body>
